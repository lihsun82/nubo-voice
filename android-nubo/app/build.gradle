plugins {
    id "com.android.application"
}

android {
    namespace "com.ainubo.nubo"
    compileSdk 35

    defaultConfig {
        applicationId "com.ainubo.nubo"
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName "0.24.0"
    }

    signingConfigs {
        ainuboStable {
            storeFile file("../ainubo-debug.jks")
            storePassword "ainubo123"
            keyAlias "ainubo"
            keyPassword "ainubo123"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.ainuboStable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ainuboStable
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

def yamnetModelUrl = "https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite"
def yamnetModelFile = file("$projectDir/src/main/assets/yamnet.tflite")

tasks.register("downloadYamnetModel") {
    outputs.file(yamnetModelFile)
    doLast {
        if (!yamnetModelFile.exists() || yamnetModelFile.length() < 1_000_000L) {
            yamnetModelFile.parentFile.mkdirs()
            println "Downloading official MediaPipe YAMNet model for NUBO Sense..."
            new URL(yamnetModelUrl).withInputStream { input ->
                yamnetModelFile.withOutputStream { output ->
                    output << input
                }
            }
        }
        if (!yamnetModelFile.exists() || yamnetModelFile.length() < 1_000_000L) {
            throw new GradleException("YAMNet model download failed or model is unexpectedly small")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("downloadYamnetModel"))
}

dependencies {
    implementation "com.google.mediapipe:tasks-audio:1.0.0"
}
