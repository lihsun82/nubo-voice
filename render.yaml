services:
  - type: web
    name: nubo-cloud
    runtime: node
    plan: free
    region: singapore
    branch: feat/mobile-agent-omniroute-v6
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUBO_OMNIROUTE_ENABLED
        value: "0"
      - key: OMNIROUTE_MODEL
        value: auto
      - key: NUBO_AI_PROVIDER_CHAIN
        value: gemini,groq,openai
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nubo.ainubo.com/api/google/oauth/callback
      - key: YOUTUBE_API_KEY
        sync: false

  # Diagnostic-only service. It currently runs a temporary "ok" server in Render.
  - type: web
    name: nubo-omniroute-img
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/diegosouzapw/omniroute:3.8.48
    healthCheckPath: /api/monitoring/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOW_API_KEY_REVEAL
        value: "false"
      - key: APP_LOG_TO_FILE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false

  # Kept for comparison only. This source build exceeds Render Free build memory.
  - type: web
    name: nubo-omniroute-source
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/diegosouzapw/OmniRoute.git
    branch: release/v3.8.49
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /api/monitoring/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/omniroute-data
      - key: NEXT_PUBLIC_BASE_URL
        value: https://nubo-omniroute-source.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOW_API_KEY_REVEAL
        value: "false"
      - key: OMNIROUTE_MEMORY_MB
        value: "256"
      - key: APP_LOG_TO_FILE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
