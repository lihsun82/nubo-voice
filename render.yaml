services:
  - type: web
    name: nubo-cloud
    runtime: node
    plan: starter
    region: singapore
    branch: feat/mobile-agent-omniroute-v6
    buildCommand: npm ci && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /
    autoDeployTrigger: off
    disk:
      name: nubo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUBO_OMNIROUTE_ENABLED
        value: "1"
      - key: OMNIROUTE_MODEL
        value: auto
      - key: NUBO_AI_PROVIDER_CHAIN
        value: omniroute,gemini,groq,openai
      - key: OMNIROUTE_HOSTPORT
        fromService:
          name: nubo-omniroute
          type: web
          property: hostport
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: nubo-omniroute
    runtime: image
    plan: starter
    region: singapore
    image:
      url: docker.io/diegosouzapw/omniroute:3.8.48
    autoDeployTrigger: off
    healthCheckPath: /
    disk:
      name: omniroute-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOW_API_KEY_REVEAL
        value: "false"
      - key: OMNIROUTE_MEMORY_MB
        value: "1024"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
