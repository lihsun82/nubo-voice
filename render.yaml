services:
  - type: web
    name: nubo-cloud
    runtime: node
    plan: free
    region: singapore
    branch: feat/mobile-agent-omniroute-v6
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUBO_OMNIROUTE_ENABLED
        value: "1"
      - key: OMNIROUTE_MODEL
        value: auto
      - key: NUBO_AI_PROVIDER_CHAIN
        value: omniroute,gemini,groq,openai
      - key: OMNIROUTE_PUBLIC_URL
        fromService:
          name: nubo-omniroute-source
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: nubo-omniroute-source
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/diegosouzapw/OmniRoute.git
    branch: release/v3.8.49
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/omniroute-data
      - key: NEXT_PUBLIC_BASE_URL
        value: https://nubo-omniroute-source.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ALLOW_API_KEY_REVEAL
        value: "false"
      - key: OMNIROUTE_MEMORY_MB
        value: "256"
      - key: APP_LOG_TO_FILE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
