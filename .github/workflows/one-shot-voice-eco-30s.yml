        shell: bash
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add components/GeminiVoiceConsole.tsx lib/nubo-realtime-eco.ts lib/browser-audio.ts android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          git commit -m 'feat(voice): stop cloud token use after 30s idle until wake'
          git push origin HEAD:main
