name: One-shot NUBO voice eco 30s

on:
  push:
    paths:
      - '.github/workflows/one-shot-voice-eco-30s.yml'

permissions:
  contents: write

jobs:
  apply-eco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply voice eco patch
        run: python .github/scripts/apply_voice_eco_30s.py
      - name: Commit eco sleep implementation
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add components/GeminiVoiceConsole.tsx lib/nubo-realtime-eco.ts lib/browser-audio.ts android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          git commit -m 'feat(voice): stop cloud token use after 30s idle until wake'
          git push origin HEAD:main
