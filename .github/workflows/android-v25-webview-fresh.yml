name: NUBO V25 Fresh WebView APK

on:
  push:
    branches: [fix/android-v25-webview-fresh]
    paths:
      - "scripts/apply-nubo-webview-fresh-v25.py"
      - ".github/workflows/android-v25-webview-fresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v25:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize Stable 3 + Google Home + Native Wake + fresh WebView V25
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-nubo-stable-3-audiorecord-wake.py
          node scripts/apply-web-stable-2-native-wake.mjs
          node scripts/apply-web-stable-2-shutdown.mjs
          python3 scripts/apply-nubo-youtube-background-cloud-mic-v31.py
          python3 scripts/apply-nubo-youtube-background-nosetup-v33.py
          python3 scripts/apply-nubo-webview-fresh-v25.py

      - name: Verify V25 source contracts
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          NATIVE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboNativeWakeService.java
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'versionCode 3301' android-nubo/app/build.gradle
          grep -q '22.2.3-googlehome-nativewake-webviewfresh' android-nubo/app/build.gradle
          grep -q 'android-v25' "$MAIN"
          grep -q 'System.currentTimeMillis()' "$MAIN"
          grep -q 'LOAD_NO_CACHE' "$MAIN"
          grep -q 'webView.clearCache(true)' "$MAIN"
          ! grep -q 'webView.restoreState(savedInstanceState)' "$MAIN"
          ! grep -q 'webView.saveState(outState)' "$MAIN"
          grep -q 'NuboNativeWakeV3' "$NATIVE"
          grep -q 'AudioRecord' "$NATIVE"
          grep -q 'GoogleHomeGatewayImpl' "$HOME"
          grep -q 'sdk", "1.10.0"' "$HOME"
          grep -q 'launchYouTubeNoSetupV33' "$MAIN"
          npm run typecheck

      - name: Build signed V25 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed/aligned V25 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/nubo25.txt
          grep -q "versionCode='3301'" /tmp/nubo25.txt
          grep -q "versionName='22.2.3-googlehome-nativewake-webviewfresh'" /tmp/nubo25.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/nubo25-dex.txt
          grep -q 'android-v25' /tmp/nubo25-dex.txt
          grep -q 'NuboNativeWakeV3' /tmp/nubo25-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/nubo25-dex.txt
          grep -q 'v33-background-nosetup' /tmp/nubo25-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-V22.2.3-V25-FRESH-WEBVIEW
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
