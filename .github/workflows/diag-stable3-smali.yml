name: Inspect Stable3 MainActivity Smali

on:
  workflow_dispatch:
  push:
    branches: [fix/android-v25-webview-fresh]
    paths: [".github/workflows/diag-stable3-smali.yml"]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Stable3 artifact
        uses: actions/download-artifact@v4
        with:
          name: AinuboX1-NUBO-STABLE-3.0-AUDIORECORD-NATIVE-WAKE
          path: stable3
          repository: lihsun82/nubo-voice
          run-id: 31972445305
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download apktool
        run: |
          curl -L --fail --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
      - name: Decode and inspect MainActivity
        run: |
          set -euo pipefail
          APK=$(find stable3 -name '*.apk' -print -quit)
          test -n "$APK"
          java -jar apktool.jar d -f "$APK" -o decoded >/dev/null
          MAIN=$(find decoded -path '*/com/ainubo/nubo/MainActivity.smali' -print -quit)
          echo "MAIN=$MAIN"
          test -n "$MAIN"
          echo '=== STRINGS ==='
          grep -n -E 'nubo\.ainubo\.com|stable-3|NUBO-Stable/3\.0|android-v' "$MAIN" || true
          echo '=== onCreate ==='
          sed -n '/\.method protected onCreate/,/\.end method/p' "$MAIN" | tail -n 180
          echo '=== configureWebView ==='
          sed -n '/\.method private configureWebView/,/\.end method/p' "$MAIN"
          echo '=== onSaveInstanceState ==='
          sed -n '/\.method protected onSaveInstanceState/,/\.end method/p' "$MAIN"
