name: Probe official Home SDK 1.10
on:
  push:
    branches: [fix/v29-google-home-restored-only]
    paths: ['.github/workflows/probe-home-sdk.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official Google Cloud bucket candidates
        shell: bash
        run: |
          set +e
          base='https://storage.googleapis.com/home_sdk_android'
          for obj in \
            'home.android.sdk_GHP_1_10.zip' \
            'home.android.sdk_GHP_1_10' \
            'home.android.sdk_1_10.zip' \
            'home.android.sdk_1_10_0.zip' \
            'home.android.sdk_GHP_1_10/home.android.sdk_GHP_1_10.zip' \
            'home.android.sdk_GHP_1_10/home_sdk_android.zip'; do
            url="$base/$obj"
            code=$(curl -L -sS -o /tmp/home-probe -w '%{http_code}' --max-time 20 "$url")
            size=$(wc -c </tmp/home-probe 2>/dev/null || echo 0)
            echo "$code $size $url"
            if [ "$code" = 200 ] && [ "$size" -gt 100000 ]; then
              file /tmp/home-probe || true
              unzip -l /tmp/home-probe 2>/dev/null | head -n 30 || true
              exit 0
            fi
          done
          echo 'No direct anonymous candidate resolved.'
