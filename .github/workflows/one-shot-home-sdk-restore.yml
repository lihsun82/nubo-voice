name: One-shot Google Home SDK restore

on:
  push:
    branches:
      - feat/home-sdk-1-10-0-native-restore
    paths:
      - '.github/workflows/one-shot-home-sdk-restore.yml'
      - '.github/scripts/restore_google_home_native.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Home SDK 1.10.0 native integration
        run: python .github/scripts/restore_google_home_native.py
      - name: Commit native Google Home V23
        run: |
          git config user.name "NUBO Build Bot"
          git config user.email "84670777+lihsun82@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(android): restore Google Home SDK 1.10.0 native integration"
          git push origin HEAD:feat/home-sdk-1-10-0-native-restore
