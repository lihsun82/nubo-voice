name: One-shot Hologram V3.7 HD reference

on:
  push:
    paths:
      - '.github/workflows/one-shot-hologram-v37-hd-reference.yml'

permissions:
  contents: write

jobs:
  patch-hologram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hologram V3.7 patch
        run: python .github/scripts/hologram_v37_patch.py
      - name: Commit result
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): Hologram V3.7 HD face and neck reference match'
          git push origin HEAD:main
