name: One-shot Hologram V3.7 HD reference

on:
  push:
    paths:
      - '.github/workflows/one-shot-hologram-v37-hd-reference.yml'

permissions:
  contents: write

jobs:
  patch-hologram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match reference face and neck with HD rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/NuboEnergyOrb.tsx')
          s = p.read_text()

          # Higher device-pixel density for crisper particles and fine contour lines.
          s = s.replace('return { particleCount: 3200, frameInterval: 1000 / 26, dpr: 1 };',
                        'return { particleCount: 3200, frameInterval: 1000 / 26, dpr: Math.min(window.devicePixelRatio || 1, 1.1) };')
          s = s.replace('dpr: Math.min(window.devicePixelRatio || 1, 1.12),',
                        'dpr: Math.min(window.devicePixelRatio || 1, 1.35),')
          s = s.replace('dpr: Math.min(window.devicePixelRatio || 1, 1.32),',
                        'dpr: Math.min(window.devicePixelRatio || 1, 1.7),')

          # Denser cyan wireframe bands for a higher-definition hologram silhouette.
          s = s.replace('for (let layer = 0; layer < 8; layer += 1) {',
                        'for (let layer = 0; layer < 10; layer += 1) {', 1)
          s = s.replace('for (let band = 0; band < 39; band += 1) {',
                        'for (let band = 0; band < 54; band += 1) {', 1)
          s = s.replace('const y = cy - 111 + band * 5.75;',
                        'const y = cy - 113 + band * 4.26;', 1)
          s = s.replace('for (let layer = 0; layer < 10; layer += 1) {',
                        'for (let layer = 0; layer < 12; layer += 1) {', 1)
          s = s.replace('for (let band = 0; band < 13; band += 1) {',
                        'for (let band = 0; band < 20; band += 1) {', 1)
          s = s.replace('const y = 383 + band * 16.3;',
                        'const y = 379 + band * 10.35;', 1)
          s = s.replace('const progress = band / 12;',
                        'const progress = band / 19;', 1)

          face_start = s.index('function drawFaceCore(')
          neck_start = s.index('function drawOrangeNeckEnergy(', face_start)
          particles_start = s.index('function drawParticles(', neck_start)

          new_face = r'''function drawFaceCore(
            ctx: CanvasRenderingContext2D,
            time: number,
            power: number,
            audioLevel: number,
            speaking: boolean,
          ) {
            const cx = AVATAR_WIDTH / 2;
            const cy = 220;
            const speechRhythm = speaking
              ? 0.58 +
                Math.sin(time * 0.017) * 0.18 +
                Math.sin(time * 0.031 + 1.1) * 0.12
              : 0.07 + Math.sin(time * 0.0045) * 0.025;
            const drive = Math.max(0, Math.min(1.45, audioLevel * 2.8 + speechRhythm));
            const breathe = 0.5 + 0.5 * Math.sin(time * 0.0048);
            const burst = speaking ? drive * (0.5 + 0.5 * Math.sin(time * 0.013)) : 0;

            ctx.save();

            // Hologram V3.7: diffuse orange molecular haze, never a filled sphere.
            const faceHaze = ctx.createRadialGradient(cx, cy + 2, 2, cx, cy + 2, 82 + drive * 5);
            faceHaze.addColorStop(0, `rgba(255, 190, 66, ${0.11 + power * 0.045 + drive * 0.09})`);
            faceHaze.addColorStop(0.36, `rgba(255, 143, 30, ${0.075 + drive * 0.07})`);
            faceHaze.addColorStop(0.72, `rgba(255, 112, 19, ${0.028 + drive * 0.032})`);
            faceHaze.addColorStop(1, 'rgba(255, 98, 12, 0)');
            ctx.fillStyle = faceHaze;
            ctx.beginPath();
            ctx.arc(cx, cy + 2, 84 + drive * 5, 0, Math.PI * 2);
            ctx.fill();

            // Dense horizontal orange contour lines, matching the reference face structure.
            ctx.shadowColor = 'rgba(255, 164, 39, 0.92)';
            ctx.shadowBlur = speaking ? 9 + drive * 14 : 4 + power * 5;
            for (let band = 0; band < 58; band += 1) {
              const y = cy - 58 + band * 2.03;
              const ny = (y - cy) / 59;
              const half = Math.sqrt(Math.max(0, 1 - ny * ny)) * 49;
              if (half < 1.6) continue;

              const edge = Math.max(0.12, 1 - Math.abs(ny));
              const wave = Math.sin(time * 0.0045 + band * 0.43) * (0.42 + drive * 0.85);
              const micro = Math.sin(time * 0.0105 + band * 0.79) * drive * 1.1;
              const alpha = (0.13 + power * 0.11 + drive * 0.16) * (0.42 + edge * 0.68);
              ctx.strokeStyle = gold(alpha);
              ctx.lineWidth = band % 8 === 0 ? 0.78 : 0.42;

              // Mostly continuous scan contours with tiny molecular breaks.
              const gap = band % 5 === 0 ? 1.2 + seededRandom(band + 3101) * 2.6 : 0;
              if (gap > 0) {
                ctx.beginPath();
                ctx.moveTo(cx - half, y);
                ctx.quadraticCurveTo(cx - half * 0.38 + wave, y + micro, cx - gap, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + gap, y);
                ctx.quadraticCurveTo(cx + half * 0.38 - wave, y - micro, cx + half, y);
                ctx.stroke();
              } else {
                ctx.beginPath();
                ctx.moveTo(cx - half, y);
                ctx.bezierCurveTo(
                  cx - half * 0.38 + wave,
                  y + micro,
                  cx + half * 0.38 - wave,
                  y - micro,
                  cx + half,
                  y,
                );
                ctx.stroke();
              }
            }

            ctx.shadowBlur = 0;

            // 366 particles: 70% small, 23% medium, 7% large, with a loose halo.
            for (let i = 0; i < 366; i += 1) {
              const seed = i + 3901;
              const angle = seededRandom(seed) * Math.PI * 2;
              const radialSeed = seededRandom(seed + 43);
              const isHalo = radialSeed > 0.72;
              const radial = isHalo
                ? 0.78 + seededRandom(seed + 67) * 0.72
                : Math.pow(seededRandom(seed + 67), 0.7) * 0.94;
              const rx = isHalo ? 65 : 44;
              const ry = isHalo ? 82 : 58;
              const outward = speaking ? burst * (1.2 + seededRandom(seed + 89) * 5.8) : 0;
              const microDrift =
                Math.sin(time * (0.0015 + seededRandom(seed + 113) * 0.0018) + angle) *
                (isHalo ? 1.15 : 0.42);

              const x = cx + Math.cos(angle) * (rx * radial + outward) + microDrift * Math.cos(angle);
              const y = cy + Math.sin(angle) * (ry * radial + outward * 0.82) + microDrift * Math.sin(angle);

              const sizeClass = seededRandom(seed + 131);
              let size = 0;
              let baseAlpha = 0;
              let glow = 0;
              if (sizeClass < 0.7) {
                size = 0.24 + seededRandom(seed + 151) * 0.62;
                baseAlpha = 0.14 + seededRandom(seed + 173) * 0.34;
                glow = 0;
              } else if (sizeClass < 0.93) {
                size = 0.88 + seededRandom(seed + 151) * 0.72;
                baseAlpha = 0.24 + seededRandom(seed + 173) * 0.46;
                glow = 3.5;
              } else {
                size = 1.65 + seededRandom(seed + 151) * 1.15;
                baseAlpha = 0.46 + seededRandom(seed + 173) * 0.42;
                glow = 7.5;
              }

              const shimmer = 0.42 + 0.58 * Math.max(0, Math.sin(time * 0.015 + i * 0.91 + angle));
              const edge = Math.max(0.08, 1 - radial * 0.62);
              const alpha =
                baseAlpha * edge * (0.58 + shimmer * 0.7) *
                (speaking ? 1.12 + drive * 0.48 : 0.84 + breathe * 0.13);

              if (glow > 0) {
                ctx.shadowColor = 'rgba(255, 191, 78, 0.98)';
                ctx.shadowBlur = glow + (speaking ? drive * 5 : 0);
              } else {
                ctx.shadowBlur = 0;
              }
              ctx.fillStyle = gold(alpha);
              ctx.beginPath();
              ctx.arc(x, y, size, 0, Math.PI * 2);
              ctx.fill();
            }

            // Soft peripheral molecular wisps prevent a closed-ball appearance.
            for (let wisp = 0; wisp < 8; wisp += 1) {
              const a = seededRandom(wisp + 4401) * Math.PI * 2;
              const radius = 42 + seededRandom(wisp + 4437) * 39 + burst * 4;
              const wx = cx + Math.cos(a) * radius;
              const wy = cy + Math.sin(a) * radius * 1.2;
              const wr = 11 + seededRandom(wisp + 4473) * 17 + drive * 2;
              const haze = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
              haze.addColorStop(0, `rgba(255, 155, 37, ${0.035 + drive * 0.052})`);
              haze.addColorStop(1, 'rgba(255, 126, 25, 0)');
              ctx.fillStyle = haze;
              ctx.beginPath();
              ctx.arc(wx, wy, wr, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
          }

'''

          new_neck = r'''function drawOrangeNeckEnergy(
            ctx: CanvasRenderingContext2D,
            time: number,
            power: number,
            audioLevel: number,
            speaking: boolean,
          ) {
            const cx = AVATAR_WIDTH / 2;
            const rhythm = speaking
              ? 0.74 +
                Math.sin(time * 0.015) * 0.15 +
                Math.sin(time * 0.027 + 0.9) * 0.1 +
                audioLevel * 0.95
              : 0.14 + Math.sin(time * 0.004) * 0.025;
            const drive = clamp01(rhythm);

            ctx.save();

            const neckGlow = ctx.createRadialGradient(cx, 365, 8, cx, 365, 138);
            neckGlow.addColorStop(0, `rgba(255, 174, 51, ${0.12 + power * 0.07 + drive * 0.3})`);
            neckGlow.addColorStop(0.45, `rgba(255, 123, 24, ${0.065 + drive * 0.18})`);
            neckGlow.addColorStop(1, 'rgba(255, 106, 14, 0)');
            ctx.fillStyle = neckGlow;
            ctx.fillRect(cx - 155, 266, 310, 220);

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(255, 157, 34, 0.98)';
            ctx.shadowBlur = speaking ? 16 + drive * 23 : 7 + power * 6;

            // Reference-style paired nerve bundles: flare beneath the jaw, then converge down the neck.
            for (let sideIndex = 0; sideIndex < 2; sideIndex += 1) {
              const side = sideIndex === 0 ? -1 : 1;
              for (let branch = 0; branch < 9; branch += 1) {
                const start = 13 + branch * 2.2;
                const flare = 30 + branch * 4.7;
                const mid = 25 + branch * 3.25;
                const lower = 8 + branch * 1.9;
                const pulse = Math.sin(time * 0.008 + branch * 0.72) * (0.7 + drive * 1.3);

                ctx.beginPath();
                ctx.moveTo(cx + side * start, 281 + branch * 1.2);
                ctx.bezierCurveTo(
                  cx + side * (flare + pulse),
                  310,
                  cx + side * (flare + 8 + pulse * 0.7),
                  326,
                  cx + side * mid,
                  349,
                );
                ctx.bezierCurveTo(
                  cx + side * (mid - 5),
                  376,
                  cx + side * (lower + 7),
                  414,
                  cx + side * lower,
                  458,
                );
                ctx.strokeStyle = gold(0.2 + power * 0.17 + drive * 0.4 - branch * 0.012);
                ctx.lineWidth = branch === 0 ? 1.55 : 0.48 + (8 - branch) * 0.055;
                ctx.stroke();
              }

              // Thin satellite branches like the outer orange filaments in the reference.
              for (let twig = 0; twig < 5; twig += 1) {
                const offset = 38 + twig * 5.6;
                ctx.beginPath();
                ctx.moveTo(cx + side * (25 + twig * 2.2), 302 + twig * 6);
                ctx.quadraticCurveTo(
                  cx + side * (offset + 10),
                  338 + twig * 5,
                  cx + side * (24 + twig * 2.1),
                  389 + twig * 7,
                );
                ctx.strokeStyle = gold(0.11 + power * 0.09 + drive * 0.24);
                ctx.lineWidth = 0.42;
                ctx.stroke();
              }
            }

            // Fine central strands continue the orange energy into the chest.
            for (let stem = -3; stem <= 3; stem += 1) {
              ctx.beginPath();
              ctx.moveTo(cx + stem * 6.8, 331);
              ctx.bezierCurveTo(
                cx + stem * 6.0,
                365,
                cx + stem * 4.2,
                411,
                cx + stem * 3.0,
                466,
              );
              ctx.strokeStyle = gold(0.16 + power * 0.14 + drive * 0.36);
              ctx.lineWidth = stem === 0 ? 1.3 : 0.48;
              ctx.stroke();
            }

            // Dispersed molecular particles around and between the nerve bundles.
            for (let i = 0; i < 196; i += 1) {
              const p = seededRandom(i + 5103);
              const side = seededRandom(i + 5129) < 0.5 ? -1 : 1;
              const spread = (1 - p) * 60 + 9;
              const x = cx + side * spread * (0.34 + seededRandom(i + 5151) * 0.9);
              const y = 288 + p * 180 + (seededRandom(i + 5171) - 0.5) * 11;
              const classSeed = seededRandom(i + 5181);
              const shimmer = 0.46 + 0.54 * Math.sin(time * 0.016 + i * 0.79);
              let size = 0.26 + seededRandom(i + 5217) * 0.64;
              let alpha = 0.16 + seededRandom(i + 5193) * 0.36;
              if (classSeed > 0.91) {
                size = 1.15 + seededRandom(i + 5237) * 1.15;
                alpha += 0.2;
              } else if (classSeed > 0.68) {
                size = 0.72 + seededRandom(i + 5237) * 0.72;
                alpha += 0.1;
              }
              ctx.fillStyle = gold(alpha * (0.64 + shimmer * 0.64) * (1 + drive * 0.88));
              if (classSeed > 0.91 && speaking) {
                ctx.shadowColor = 'rgba(255, 183, 67, 0.96)';
                ctx.shadowBlur = 7 + drive * 8;
              } else {
                ctx.shadowBlur = 0;
              }
              ctx.beginPath();
              ctx.arc(x, y, size, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.restore();
          }

'''

          s = s[:face_start] + new_face + new_neck + s[particles_start:]
          p.write_text(s)

          # Remove this one-shot workflow from the resulting source commit.
          Path('.github/workflows/one-shot-hologram-v37-hd-reference.yml').unlink(missing_ok=True)
          PY
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): Hologram V3.7 HD face and neck reference match'
          git push origin HEAD:main
