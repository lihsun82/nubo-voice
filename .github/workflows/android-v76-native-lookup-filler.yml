name: Android V76 Native Lookup Filler APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-v76-native-lookup-filler.yml"
      - "scripts/apply-v76-native-lookup-filler.py"
      - "scripts/apply-v75-external-command-relay.py"
      - "scripts/apply-web-lookup-filler-v1.mjs"

permissions:
  contents: read

jobs:
  build-v76:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize V76 Android
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-v76-native-lookup-filler.py

      - name: Materialize V76 web bundle
        run: |
          set -euo pipefail
          node scripts/apply-web-v61-smart-assistant.mjs
          node scripts/apply-v62-real-hotel-monitor-bridge.cjs
          node scripts/apply-web-v63-voice-intent-guard.cjs
          node scripts/apply-web-v64-conversation-sensitive.cjs
          node scripts/apply-web-v65-response-sla.cjs
          node scripts/apply-web-v66-voice-stability.cjs
          node scripts/apply-web-v67-location-performance-home.cjs
          node scripts/apply-web-v68-maps-list-geolock.cjs
          node scripts/apply-web-v69-restore-v33-maps.cjs
          node scripts/apply-web-v70-remove-30s-eco.cjs
          node scripts/apply-web-v71-youtube66-maps-background.cjs
          node scripts/apply-web-v72-youtube-v64-banner.cjs
          node scripts/apply-web-v73-force-native-youtube-banner.cjs
          node scripts/apply-web-v74-dom-youtube-banner.cjs
          node scripts/apply-web-v75-external-command-relay.cjs
          node scripts/apply-web-lookup-filler-v1.mjs

      - name: Verify V76 native filler contract
        run: |
          set -euo pipefail
          grep -q 'versionCode 76' android-nubo/app/build.gradle
          grep -q '0.76.0-native-lookup-filler' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/76' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'speakLookupFiller(String text)' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'stopLookupFiller()' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'nubo-native-lookup-filler' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'Locale.TAIWAN' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'NUBO_LOOKUP_FILLER_V1' components/GeminiVoiceConsole.tsx
          grep -q 'speakLookupFiller?.(phrase)' components/GeminiVoiceConsole.tsx
          grep -q 'stopLookupFiller?.()' components/GeminiVoiceConsole.tsx
          grep -q '好喔，我幫你查一下嘿，稍等我一下唷' components/GeminiVoiceConsole.tsx
          grep -q 'openExternalApp' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'playYouTubeNoSetup' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java

      - name: Typecheck V76
        run: npx tsc --noEmit

      - name: Build signed V76 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed V76 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v76.txt
          grep -q "versionCode='76'" /tmp/v76.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v76-NATIVE-LOOKUP-FILLER
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
