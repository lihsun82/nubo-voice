name: Verify Amenity Semantic Dedupe

on:
  push:
    branches: [fix/amenity-semantic-dedupe]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Reset patched sources
        run: git reset --hard HEAD && git clean -fd -e node_modules
      - name: Production build
        run: npm run build
