name: Google Home Legacy Probe

on:
  push:
    branches:
      - diag/google-home-legacy-probe-2026-08-13
    paths:
      - ".github/workflows/google-home-legacy-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe historical Railway smart-home bridge
        shell: bash
        run: |
          set +e
          BASE='https://nubo-voice-production.up.railway.app/api/smart-home/light'
          echo '=== historical Railway GET ==='
          curl -sS -i --max-time 25 "$BASE" || true
          echo
          echo '=== historical Railway ON ==='
          curl -sS -i --max-time 35 \
            -X POST "$BASE" \
            -H 'Content-Type: application/json' \
            --data '{"action":"on","room":"NUBO_DIAG","device":"投射燈"}' || true
          echo
          sleep 2
          echo '=== historical Railway OFF ==='
          curl -sS -i --max-time 35 \
            -X POST "$BASE" \
            -H 'Content-Type: application/json' \
            --data '{"action":"off","room":"NUBO_DIAG","device":"投射燈"}' || true
          echo
