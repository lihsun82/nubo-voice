name: Google Home Legacy Probe

on:
  push:
    branches:
      - diag/google-home-legacy-probe-2026-08-13
    paths:
      - ".github/workflows/google-home-legacy-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production provider and test if ready
        shell: bash
        run: |
          set -u
          echo '=== production status ==='
          STATUS="$(curl -sS --max-time 20 https://nubo.ainubo.com/api/smart-home/light)"
          echo "$STATUS"
          AVAILABLE="$(printf '%s' "$STATUS" | jq -r '.available // false')"
          if [ "$AVAILABLE" != "true" ]; then
            echo 'NO_CONFIGURED_PROVIDER'
            exit 0
          fi

          echo '=== production ON ==='
          ON="$(curl -sS --max-time 35 \
            -X POST https://nubo.ainubo.com/api/smart-home/light \
            -H 'Content-Type: application/json' \
            --data '{"action":"on","room":"NUBO_DIAG","device":"投射燈"}')"
          echo "$ON"
          sleep 2

          echo '=== production OFF ==='
          OFF="$(curl -sS --max-time 35 \
            -X POST https://nubo.ainubo.com/api/smart-home/light \
            -H 'Content-Type: application/json' \
            --data '{"action":"off","room":"NUBO_DIAG","device":"投射燈"}')"
          echo "$OFF"

          test "$(printf '%s' "$ON" | jq -r '.ok // false')" = "true"
          test "$(printf '%s' "$OFF" | jq -r '.ok // false')" = "true"
