name: Google Home Legacy Probe

on:
  push:
    branches:
      - diag/google-home-legacy-probe-2026-08-13
    paths:
      - ".github/workflows/google-home-legacy-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current production bridge
        shell: bash
        run: |
          set +e
          echo '=== current production ==='
          curl -sS -i --max-time 20 https://nubo.ainubo.com/api/smart-home/light || true
          echo

      - name: Probe legacy Render route
        shell: bash
        run: |
          set +e
          echo '=== legacy render GET ==='
          curl -sS -i --max-time 30 https://nubo-cloud.onrender.com/api/smart-home/light || true
          echo

      - name: Test legacy bridge ON then OFF
        shell: bash
        run: |
          set +e
          echo '=== legacy ON ==='
          curl -sS -i --max-time 30 \
            -X POST https://nubo-cloud.onrender.com/api/smart-home/light \
            -H 'Content-Type: application/json' \
            --data '{"action":"on","room":"NUBO_DIAG","device":"tapo_p100"}' || true
          echo
          sleep 2
          echo '=== legacy OFF ==='
          curl -sS -i --max-time 30 \
            -X POST https://nubo-cloud.onrender.com/api/smart-home/light \
            -H 'Content-Type: application/json' \
            --data '{"action":"off","room":"NUBO_DIAG","device":"tapo_p100"}' || true
          echo
