name: NUBO Persona One-shot

on:
  push:
    paths:
      - ".github/workflows/nubo-persona-once.yml"

permissions:
  contents: write

jobs:
  patch-persona:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only Gemini Live persona prelude
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/browser-nubo-tools-line.ts")
          text = path.read_text(encoding="utf-8")
          old = "你是NUBO，Leo的智慧語音總管。只用自然、簡潔的繁體中文回答，不朗讀冗長內容。"
          new = """你是NUBO，Leo的智慧語音總管，也是一個自然、聰明、有判斷力的中文AI語音助理。

對話人格與口語風格：
1. 主要使用台灣繁體中文自然口語，像熟悉很久、可靠又懂使用者的朋友，不要像客服、播報員或制式機器人。
2. 回答先講重點，再視需要補充；簡單問題短而自然，複雜問題可以完整回答，不要為了短而犧牲重要資訊。
3. 可以自然使用「嗯」、「對啊」、「好」、「欸」、「我懂」、「可以啊」等語助詞，但不要每句刻意塞入。
4. 日常聊天可以輕鬆、有情緒、有朋友感；可以適度幽默、吐槽或輕笑，但不得冒犯，也不能因追求幽默降低準確度。
5. 不要每次重述使用者問題，也避免一直使用「好的，以下是」、「當然可以」、「很高興為您」等官方或客服式開場。
6. 使用者講話不完整、有停頓、自我修正或口語省略時，優先理解真正意圖與上下文，不要只按逐字稿表面回答。
7. 能承接前面對話，不要把每一句都當成全新話題；使用者只是聊天時更生活化，問工作、設備、旅館、AI、商業或技術時則切換成準確、清楚、有邏輯的模式。
8. 語音回答避免朗讀書面標題、編號、表格或冗長格式，除非使用者明確要求。
9. 遇到開車、醫療、危險設備、付款或緊急事件等高風險情境時，安全優先，先用簡短清楚的方式提醒必要風險。
10. 保持有判斷力但不搶話、不說教；不知道的事情不要假裝知道。"""

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one persona prelude, found {count}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify protected routing rules remain
        shell: bash
        run: |
          grep -F 'google_home_light' lib/browser-nubo-tools-line.ts
          grep -F 'open_youtube' lib/browser-nubo-tools-line.ts
          grep -F 'gmail_prepare_send' lib/browser-nubo-tools-line.ts
          grep -F 'guest_service_alert' lib/browser-nubo-tools-line.ts

      - name: Commit persona-only change
        shell: bash
        run: |
          git config user.name "NUBO Persona Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/browser-nubo-tools-line.ts
          git diff --cached --check
          git commit -m "feat(voice): make NUBO conversational and natural"
          git push
