name: NUBO Persona One-shot

on:
  push:
    paths:
      - ".github/workflows/nubo-persona-once.yml"

permissions:
  contents: write

jobs:
  patch-persona:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Gemini Live persona through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          path = "lib/browser-nubo-tools-line.ts"
          url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=main"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nubo-persona-once",
          }

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              meta = json.load(r)

          text = base64.b64decode(meta["content"]).decode("utf-8")
          old = "你是NUBO，Leo的智慧語音總管。只用自然、簡潔的繁體中文回答，不朗讀冗長內容。"
          new = """你是NUBO，Leo的智慧語音總管，也是一個自然、聰明、有判斷力的中文AI語音助理。

對話人格與口語風格：
1. 主要使用台灣繁體中文自然口語，像熟悉很久、可靠又懂使用者的朋友，不要像客服、播報員或制式機器人。
2. 回答先講重點，再視需要補充；簡單問題短而自然，複雜問題可以完整回答，不要為了短而犧牲重要資訊。
3. 可以自然使用「嗯」、「對啊」、「好」、「欸」、「我懂」、「可以啊」等語助詞，但不要每句刻意塞入。
4. 日常聊天可以輕鬆、有情緒、有朋友感；可以適度幽默、吐槽或輕笑，但不得冒犯，也不能因追求幽默降低準確度。
5. 不要每次重述使用者問題，也避免一直使用「好的，以下是」、「當然可以」、「很高興為您」等官方或客服式開場。
6. 使用者講話不完整、有停頓、自我修正或口語省略時，優先理解真正意圖與上下文，不要只按逐字稿表面回答。
7. 能承接前面對話，不要把每一句都當成全新話題；使用者只是聊天時更生活化，問工作、設備、旅館、AI、商業或技術時則切換成準確、清楚、有邏輯的模式。
8. 語音回答避免朗讀書面標題、編號、表格或冗長格式，除非使用者明確要求。
9. 遇到開車、醫療、危險設備、付款或緊急事件等高風險情境時，安全優先，先用簡短清楚的方式提醒必要風險。
10. 保持有判斷力但不搶話、不說教；不知道的事情不要假裝知道。"""

          if old not in text:
              if "對話人格與口語風格：" in text:
                  print("Persona already applied; nothing to do.")
                  raise SystemExit(0)
              raise SystemExit("Original persona prelude not found; refusing broad edit.")

          updated = text.replace(old, new, 1)
          for protected in ["google_home_light", "open_youtube", "gmail_prepare_send", "guest_service_alert"]:
              if protected not in updated:
                  raise SystemExit(f"Protected routing rule missing: {protected}")

          payload = json.dumps({
              "message": "feat(voice): make NUBO conversational and natural",
              "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
              "sha": meta["sha"],
              "branch": "main",
          }).encode("utf-8")
          put = urllib.request.Request(url, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(put) as r:
              result = json.load(r)
          print("Updated commit:", result["commit"]["sha"])
          PY
