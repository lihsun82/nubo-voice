name: One-shot check Home SDK secret

on:
  push:
    branches:
      - feat/home-sdk-1-10-0-native-restore
    paths:
      - '.github/workflows/one-shot-check-home-sdk-secret.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      S1: ${{ secrets.HOME_ANDROID_SDK_1_10_0_B64 }}
      S2: ${{ secrets.GOOGLE_HOME_SDK_B64 }}
      S3: ${{ secrets.HOME_SDK_ZIP_B64 }}
      S4: ${{ secrets.NUBO_GOOGLE_HOME_SDK_B64 }}
      S5: ${{ secrets.HOME_ANDROID_SDK_ZIP_B64 }}
    steps:
      - name: Check known SDK secret slots without exposing values
        run: |
          for n in S1 S2 S3 S4 S5; do
            if [ -n "${!n}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
