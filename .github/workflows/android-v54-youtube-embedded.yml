name: Android V67 Geo YouTube Home Stability APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-v67-location-youtube-home.py"
      - "scripts/apply-web-v67-location-performance-home.cjs"
      - "app/api/places/search/route.ts"
      - "scripts/apply-v66-voice-stability.py"
      - "scripts/apply-web-v66-voice-stability.cjs"
      - "scripts/apply-v65-response-sla.py"
      - "scripts/apply-web-v65-response-sla.cjs"
      - "scripts/apply-v64-conversation-sensitive.py"
      - "scripts/apply-web-v64-conversation-sensitive.cjs"
      - "scripts/apply-v63-voice-intent-guard.py"
      - "scripts/apply-web-v63-voice-intent-guard.cjs"
      - "scripts/apply-v62-hotel-monitor-bridge.py"
      - "scripts/apply-v61-smart-assistant.py"
      - "package.json"
      - "lib/browser-nubo-tools.ts"
      - "lib/browser-nubo-tools-line.ts"
      - "android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-v67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-v67-location-youtube-home.py

      - name: Verify V67 scope
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'versionCode 67' android-nubo/app/build.gradle
          grep -q '0.67.0-geo-youtube-home-stable' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/67' "$MAIN"
          grep -q 'bundle=v67' "$MAIN"
          grep -q 'RENDERER_PRIORITY_IMPORTANT' "$MAIN"
          grep -q 'setOffscreenPreRaster(true)' "$MAIN"
          grep -q 'p.setVolume(72)' "$MAIN"
          grep -q 'createOnDeviceSpeechRecognizer' "$MAIN"
          grep -q 'nubo_google_home_permission_v61' "$HOME"
          grep -q 'CACHED_GRANTED' "$HOME"
          grep -q 'putBoolean("granted", true).commit()' "$HOME"
          grep -q 'sdk", "1.10.0"' "$HOME"
          if grep -q 'remove("granted")' "$HOME"; then exit 1; fi

      - name: Build signed V67 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V67 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v67.txt
          grep -q "versionCode='67'" /tmp/v67.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v67-dex.txt
          grep -q 'NUBO-Android/67' /tmp/v67-dex.txt
          grep -q 'RENDERER_PRIORITY_IMPORTANT' /tmp/v67-dex.txt
          grep -q 'CACHED_GRANTED' /tmp/v67-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v67-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v67-GEO-YOUTUBE-HOME-STABLE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
