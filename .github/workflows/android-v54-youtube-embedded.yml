name: Android V71 YouTube66 Maps Background APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-v71-youtube66-maps-background.py"
      - "scripts/apply-web-v71-youtube66-maps-background.cjs"
      - "scripts/apply-v70-remove-30s-eco.py"
      - "scripts/apply-web-v70-remove-30s-eco.cjs"
      - "scripts/apply-v69-restore-v33-maps.py"
      - "scripts/apply-web-v69-restore-v33-maps.cjs"
      - "scripts/apply-v68-maps-list-geolock.py"
      - "scripts/apply-web-v68-maps-list-geolock.cjs"
      - "scripts/apply-v67-location-youtube-home.py"
      - "scripts/apply-web-v67-location-performance-home.cjs"
      - "package.json"
      - "components/GeminiVoiceConsole.tsx"
      - "lib/browser-nubo-tools.ts"
      - "lib/browser-nubo-tools-line.ts"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-v71:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-v71-youtube66-maps-background.py

      - name: Verify V71 isolated scope
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'versionCode 71' android-nubo/app/build.gradle
          grep -q '0.71.0-youtube66-maps-background' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/71' "$MAIN"
          grep -q 'bundle=v71' "$MAIN"

          # V66 embedded YouTube capabilities must still be present.
          grep -q 'embeddedYouTubeOverlayV58' "$MAIN"
          grep -q 'showEmbeddedYouTubeV58' "$MAIN"
          grep -q 'root.addView(overlay, overlayParams)' "$MAIN"
          grep -q 'Gravity.BOTTOM' "$MAIN"
          grep -q 'p.setVolume(72)' "$MAIN"

          # Existing native external keep-alive/PiP path must stay intact.
          grep -q 'beginExternalVoiceKeepAlive' "$MAIN"
          grep -q 'enterPictureInPictureMode' "$MAIN"
          grep -q 'openExternalApp' "$MAIN"

          grep -q 'RENDERER_PRIORITY_IMPORTANT' "$MAIN"
          grep -q 'setOffscreenPreRaster(true)' "$MAIN"
          grep -q 'createOnDeviceSpeechRecognizer' "$MAIN"
          grep -q 'nubo_google_home_permission_v61' "$HOME"
          grep -q 'CACHED_GRANTED' "$HOME"
          grep -q 'putBoolean("granted", true).commit()' "$HOME"
          grep -q 'sdk", "1.10.0"' "$HOME"

          node scripts/apply-web-v61-smart-assistant.mjs
          node scripts/apply-v62-real-hotel-monitor-bridge.cjs
          node scripts/apply-web-v63-voice-intent-guard.cjs
          node scripts/apply-web-v64-conversation-sensitive.cjs
          node scripts/apply-web-v65-response-sla.cjs
          node scripts/apply-web-v66-voice-stability.cjs
          node scripts/apply-web-v67-location-performance-home.cjs
          node scripts/apply-web-v68-maps-list-geolock.cjs
          node scripts/apply-web-v69-restore-v33-maps.cjs
          node scripts/apply-web-v70-remove-30s-eco.cjs
          node scripts/apply-web-v71-youtube66-maps-background.cjs

          # Only the two requested web routes are changed.
          grep -q 'NUBO_V71_YOUTUBE_V66_EMBED_ROUTE' components/GeminiVoiceConsole.tsx
          grep -q 'call.name === "open_youtube"' components/GeminiVoiceConsole.tsx
          grep -q 'NUBO_V71_MAPS_BACKGROUND_VOICE_KEEPALIVE' lib/browser-nubo-tools.ts
          grep -q 'nativeBridge?.openExternalApp?.(url, "Google Maps")' lib/browser-nubo-tools.ts
          grep -q 'NUBO_V70_NO_30S_ECO' components/GeminiVoiceConsole.tsx
          if grep -q 'Date.now() - lastInteractionAtRef.current >= NUBO_ECO_IDLE_MS' components/GeminiVoiceConsole.tsx; then exit 1; fi

          # V69 V33 Maps search semantics stay unchanged.
          grep -q 'NUBO_MOBILE_PLACES_V1' lib/browser-nubo-tools.ts
          grep -q 'provider: "Google Maps"' lib/browser-nubo-tools.ts
          grep -q 'location || "目前位置"' lib/browser-nubo-tools.ts
          if grep -q 'NUBO_NEARBY_GEOLOCK_V67' lib/browser-nubo-tools.ts; then exit 1; fi
          if grep -q 'NUBO_MAPS_LIST_V68' lib/browser-nubo-tools.ts; then exit 1; fi

      - name: Build signed V71 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V71 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v71.txt
          grep -q "versionCode='71'" /tmp/v71.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v71-dex.txt
          grep -q 'NUBO-Android/71' /tmp/v71-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v71-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v71-YOUTUBE66-MAPS-BACKGROUND
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
