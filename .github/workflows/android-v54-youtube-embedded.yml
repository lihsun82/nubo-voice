name: Android V60 Restored Baseline APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-ui-v60-hide-capabilities.py"
      - "scripts/apply-ui-v59-force-hide-panels.py"
      - "package.json"
      - "app/api/notify/guest-service/route.ts"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-v60:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize exact V60 Android baseline
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-ui-v60-hide-capabilities.py

      - name: Verify exact V60 baseline
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'versionCode 60' android-nubo/app/build.gradle
          grep -q '0.60.0-native-hide-panels-capabilities' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/60' "$MAIN"
          grep -q 'android-v60' "$MAIN"
          grep -q 'bundle=v60' "$MAIN"
          grep -q 'nubo-v60-hide-panels' "$MAIN"
          grep -q '.question-history,.task-center,.capabilities{display:none!important}' "$MAIN"
          grep -q 'p.setVolume(72)' "$MAIN"
          grep -q 'createOnDeviceSpeechRecognizer' "$MAIN"
          grep -q 'sdk", "1.10.0"' "$HOME"
          if grep -q 'NUBO_V61' components/GeminiVoiceConsole.tsx; then exit 1; fi
          if grep -q 'NUBO_V70_NO_30S_ECO' components/GeminiVoiceConsole.tsx; then exit 1; fi
          if grep -q 'NUBO_V74_DOM_YOUTUBE_BANNER' components/GeminiVoiceConsole.tsx; then exit 1; fi
          if grep -q 'NUBO_V75_EXTERNAL_COMMAND_RELAY' components/GeminiVoiceConsole.tsx; then exit 1; fi
          npm run typecheck

      - name: Build signed V60 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed V60 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v60.txt
          grep -q "versionCode='60'" /tmp/v60.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v60-dex.txt
          grep -q 'NUBO-Android/60' /tmp/v60-dex.txt
          grep -q 'nubo-v60-hide-panels' /tmp/v60-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v60-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v60-RESTORED-BASELINE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
