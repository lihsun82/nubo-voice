name: NUBO Stable 2.0 Native Offline Wake APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-nubo-stable-1.py"
      - "scripts/apply-nubo-stable-2-native-wake.py"
      - "scripts/apply-web-stable-2-native-wake.mjs"
      - "scripts/apply-youtube-v9-restore-v43.py"
      - "components/GeminiVoiceConsole.tsx"
      - "lib/browser-nubo-tools.ts"
      - "package.json"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-stable-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize Stable 2 native wake
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-nubo-stable-2-native-wake.py
          node scripts/apply-web-stable-2-native-wake.mjs

      - name: Verify Stable 2 architecture
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          SERVICE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboNativeWakeService.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          WEB=components/GeminiVoiceConsole.tsx

          grep -q 'versionCode 2000' android-nubo/app/build.gradle
          grep -q '2.0.0-native-offline-wake' android-nubo/app/build.gradle
          grep -q 'vosk-android:0.3.75' android-nubo/app/build.gradle
          grep -q 'prepareNuboVoskModel' android-nubo/app/build.gradle
          grep -q 'NUBO-Stable/2.0' "$MAIN"
          grep -q 'armNativeWakeService' "$MAIN"
          grep -q 'enterNativeWakeMode' "$MAIN"
          grep -q 'dispatchNativeWakeFromService' "$MAIN"
          grep -q 'NuboNativeWakeService.isRunning()' "$MAIN"
          grep -q 'org.vosk.android.SpeechService' "$SERVICE"
          grep -q 'model-cn-small' "$SERVICE"
          grep -q '兄弟' "$SERVICE"
          grep -q '有人嗎' "$SERVICE"
          grep -q 'ACTION_WAKE_MODE' "$SERVICE"
          grep -q 'foregroundServiceType="microphone"' "$MANIFEST"
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$MANIFEST"
          grep -q 'WAKE_LOCK' "$MANIFEST"
          grep -q 'NUBO_STABLE_2_NATIVE_WAKE' "$WEB"
          grep -q 'enterNativeWakeMode' "$WEB"
          grep -q 'markCloudVoiceActive' "$WEB"
          grep -q '不消耗Token' "$WEB"

          # Prove the unstable SpeechRecognizer background loop is gone.
          test ! -f android-nubo/app/src/main/java/com/ainubo/nubo/NuboBackgroundListeningService.java
          if grep -q 'SpeechRecognizer' "$SERVICE"; then exit 1; fi

          # Preserve stable application contracts.
          grep -q 'public boolean playYouTubeNoSetup' "$MAIN"
          grep -q 'activity.launchExternalTarget(safeTarget, safeLabel)' "$MAIN"
          grep -q 'com.google.android.youtube' "$MAIN"
          grep -q 'NUBO_MOBILE_PLACES_V1' lib/browser-nubo-tools.ts
          grep -q 'provider: "Google Maps"' lib/browser-nubo-tools.ts
          grep -q 'location || "目前位置"' lib/browser-nubo-tools.ts
          grep -q 'sdk", "1.10.0"' "$HOME"
          grep -q 'homeArtifact", "17.1.0"' "$HOME"

          npm run typecheck

      - name: Build signed Stable 2 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed Stable 2 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/stable2.txt
          grep -q "versionCode='2000'" /tmp/stable2.txt
          grep -q "versionName='2.0.0-native-offline-wake'" /tmp/stable2.txt
          grep -q "application-label:'AinuboX1'" /tmp/stable2.txt
          unzip -l "$APK" | grep -q 'assets/model-cn-small/am/final.mdl'
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/stable2-dex.txt
          grep -q 'NUBO-Stable/2.0' /tmp/stable2-dex.txt
          grep -q 'NuboNativeWakeService' /tmp/stable2-dex.txt
          grep -q 'com.google.android.youtube' /tmp/stable2-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/stable2-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-NUBO-STABLE-2.0-NATIVE-OFFLINE-WAKE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
