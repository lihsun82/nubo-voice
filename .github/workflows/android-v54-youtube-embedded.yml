name: Android V56 YouTube Nonmodal Wake Recovery APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-youtube-v56-nonmodal-wake-recovery.py"
      - ".github/workflows/android-v54-youtube-embedded.yml"
  push:
    branches: [main]
    paths:
      - "scripts/apply-youtube-v56-nonmodal-wake-recovery.py"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-v56:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-youtube-v56-nonmodal-wake-recovery.py

      - name: Verify V56 non-modal wake recovery scope
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'versionCode 56' android-nubo/app/build.gradle
          grep -q '0.56.0-youtube-nonmodal-wake-recovery' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/56' "$MAIN"
          grep -q 'embeddedYouTubeOverlayV56' "$MAIN"
          grep -q 'root.addView(overlay, overlayParams)' "$MAIN"
          ! grep -q 'private Dialog embeddedYouTubeDialogV56' "$MAIN"
          grep -q 'webView.resumeTimers();' "$MAIN"
          grep -q 'onStateChange:function(e)' "$MAIN"
          grep -q 'getPlayerState()===3' "$MAIN"
          grep -q 'loadDataWithBaseURL("https://nubo.ainubo.com/' "$MAIN"
          grep -q 'YOUTUBE_RELAUNCH_GUARD_MS = 60_000L' "$MAIN"
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V56 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V56 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v56.txt
          grep -q "versionCode='56'" /tmp/v56.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v56-dex.txt
          grep -q 'NUBO-Android/56' /tmp/v56-dex.txt
          grep -q 'embeddedYouTubeOverlayV56' /tmp/v56-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v56-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v56-YOUTUBE-NONMODAL-WAKE-RECOVERY
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
