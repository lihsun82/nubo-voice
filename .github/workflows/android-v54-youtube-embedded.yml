name: Android V58 YouTube Stable Audio Native Wake APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-youtube-v58-fixed-volume-native-wake-order.py"
      - "components/GeminiVoiceConsole.tsx"
      - ".github/workflows/android-v54-youtube-embedded.yml"
  push:
    branches: [main]
    paths:
      - "scripts/apply-youtube-v58-fixed-volume-native-wake-order.py"
      - "components/GeminiVoiceConsole.tsx"
      - ".github/workflows/android-v54-youtube-embedded.yml"

permissions:
  contents: read

jobs:
  build-v58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-youtube-v58-fixed-volume-native-wake-order.py

      - name: Verify V58 stable audio and native wake order
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          CONSOLE=components/GeminiVoiceConsole.tsx
          grep -q 'versionCode 58' android-nubo/app/build.gradle
          grep -q '0.58.0-youtube-stable-audio-native-wake-order' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/58' "$MAIN"
          grep -q 'embeddedYouTubeOverlayV58' "$MAIN"
          grep -q 'p.setVolume(72)' "$MAIN"
          ! grep -q 'volume = 24' "$MAIN"
          ! grep -q 'volume = 55' "$MAIN"
          grep -q 'createOnDeviceSpeechRecognizer' "$MAIN"
          grep -q 'recreateWakeRecognizerV58' "$MAIN"
          grep -q 'wakeGenerationV58' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('components/GeminiVoiceConsole.tsx').read_text()
          n=s.find('nativeBridge?.startWakeListener?.()')
          m=s.find('if (isMobileBrowser) return;', n)
          assert n >= 0 and m > n, (n,m)
          PY
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V58 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V58 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v58.txt
          grep -q "versionCode='58'" /tmp/v58.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v58-dex.txt
          grep -q 'NUBO-Android/58' /tmp/v58-dex.txt
          grep -q 'embeddedYouTubeOverlayV58' /tmp/v58-dex.txt
          grep -q 'createOnDeviceSpeechRecognizer' /tmp/v58-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v58-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v58-YOUTUBE-STABLE-AUDIO-NATIVE-WAKE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
