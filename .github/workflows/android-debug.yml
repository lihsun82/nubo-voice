name: Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "components/GeminiVoiceConsole.tsx"
      - "lib/mobile-direct-app-v4.ts"
      - "lib/youtube-quality-search.ts"
      - "app/api/youtube/open/route.ts"
      - "scripts/apply-nubo-v28-build.py"
      - "scripts/apply-google-home-v29.py"
      - "scripts/apply-youtube-native-app-v39.py"
      - "scripts/apply-youtube-hybrid-v40.py"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "components/GeminiVoiceConsole.tsx"
      - "lib/mobile-direct-app-v4.ts"
      - "lib/youtube-quality-search.ts"
      - "app/api/youtube/open/route.ts"
      - "scripts/apply-nubo-v28-build.py"
      - "scripts/apply-google-home-v29.py"
      - "scripts/apply-youtube-native-app-v39.py"
      - "scripts/apply-youtube-hybrid-v40.py"

permissions:
  contents: write

jobs:
  build-stable-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize stable AinuboX1 signing key
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo

      - name: Materialize and verify AinuboX1 launcher icon
        run: |
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          grep -q 'JPEG image data' <(file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg)

      - name: Download official Google Home Android SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          HOME_SDK_ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          HOME_SDK_REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$HOME_SDK_ZIP"
          test "$(stat -c%s "$HOME_SDK_ZIP")" -gt 100000000
          mkdir -p "$HOME_SDK_REPO"
          unzip -q "$HOME_SDK_ZIP" -d "$HOME_SDK_REPO"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home-types/17.1.0/play-services-home-types-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$HOME_SDK_REPO" >> "$GITHUB_ENV"

      - name: Apply unchanged V28 voice and UI build
        run: python3 scripts/apply-nubo-v28-build.py

      - name: Restore Google Home SDK 1.10.0 bridge only
        run: python3 scripts/apply-google-home-v29.py

      - name: Apply V40 hybrid YouTube switch build
        run: python3 scripts/apply-youtube-hybrid-v40.py

      - name: Verify V40 hybrid switch and non-regression baselines
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          SERVICE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboYouTubeAccessibilityService.java
          SERVICE_XML=android-nubo/app/src/main/res/xml/nubo_youtube_accessibility_service.xml

          # Non-regression baselines: Google Home, voice/PiP and exact resolver stay intact.
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'homeArtifact", "17.1.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'public boolean googleHomeControl' "$MAIN"
          grep -q 'NUBO_YOUTUBE_LOCAL_FAST_ROUTE_V33' components/GeminiVoiceConsole.tsx
          grep -q 'youtube-exact-room-player-v38' app/api/youtube/open/route.ts
          grep -q 'google_search' lib/youtube-quality-search.ts
          grep -q 'youtube.com/oembed' lib/youtube-quality-search.ts
          ! grep -q 'results?search_query' app/api/youtube/open/route.ts

          # First song remains V39 native exact deep-link behavior.
          grep -q 'queryIntentActivities' "$MAIN"
          grep -q 'scoreYouTubeDeepLinkActivity' "$MAIN"
          grep -q 'v39-runtime-deeplink-handler' "$MAIN"
          grep -q 'v39-v15-6-41-legacy-app-link' "$MAIN"

          # Repeated songs now use the foreground YouTube UI controller.
          grep -q 'NuboYouTubeAccessibilityService.isReady()' "$MAIN"
          grep -q 'NuboYouTubeAccessibilityService.requestSongSwitch(uiQuery)' "$MAIN"
          grep -q 'Settings.ACTION_ACCESSIBILITY_SETTINGS' "$MAIN"
          grep -q 'public boolean isYouTubeUiAgentReady' "$MAIN"
          grep -q 'public boolean openYouTubeControlSettings' "$MAIN"
          grep -q 'NuboYouTubeAccessibilityService' "$MANIFEST"
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -q 'ACTION_SET_TEXT' "$SERVICE"
          grep -q 'ACTION_IME_ENTER' "$SERVICE"
          grep -q 'secondPassIfSearchStillVisible' "$SERVICE"
          grep -q 'do NOT use a generic Pause' "$SERVICE"
          grep -q 'dispatchGesture' "$SERVICE"
          grep -q 'packageNames="com.google.android.youtube"' "$SERVICE_XML"

          # Do not bring back the failed embedded IFrame/player architecture.
          test ! -e android-nubo/app/src/main/java/com/ainubo/nubo/NuboYouTubePlayerActivity.java
          ! grep -q 'NuboYouTubePlayerActivity' "$MANIFEST"
          ! grep -q 'www.youtube.com/iframe_api' "$SERVICE"

      - name: Build signed AinuboX1 V40 hybrid YouTube APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify APK signature, package, Google Home and V40 payload
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/ainubox1-badging.txt
          head -n 8 /tmp/ainubox1-badging.txt
          grep -q "versionCode='40'" /tmp/ainubox1-badging.txt
          grep -q "application-label:'AinuboX1'" /tmp/ainubox1-badging.txt
          unzip -l "$APK" | grep -q 'assets/yamnet.tflite'
          unzip -l "$APK" | grep -q 'play-services-home.properties'

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/v40-manifest-tree.txt
          grep -q 'NuboYouTubeAccessibilityService' /tmp/v40-manifest-tree.txt
          grep -q 'BIND_ACCESSIBILITY_SERVICE' /tmp/v40-manifest-tree.txt
          ! grep -q 'NuboYouTubePlayerActivity' /tmp/v40-manifest-tree.txt

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v40-dex-strings.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v40-dex-strings.txt
          grep -q '17.1.0' /tmp/v40-dex-strings.txt
          grep -q 'com.google.android.youtube' /tmp/v40-dex-strings.txt
          grep -q 'v39-runtime-deeplink-handler' /tmp/v40-dex-strings.txt
          grep -q 'v39-v15-6-41-legacy-app-link' /tmp/v40-dex-strings.txt
          grep -q 'NuboYouTubeAccessibilityService' /tmp/v40-dex-strings.txt
          grep -q 'secondPassIfSearchStillVisible' /tmp/v40-dex-strings.txt
          ! grep -q 'NuboYouTubePlayerActivity' /tmp/v40-dex-strings.txt
          ! grep -q 'www.youtube.com/iframe_api' /tmp/v40-dex-strings.txt

      - name: Publish V40 hybrid YouTube APK
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-v40-YOUTUBE-HYBRID-SWITCH.apk
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AinuboX1-v40-YOUTUBE-HYBRID-SWITCH.apk public/downloads/AinuboX1-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish AinuboX1 V40 hybrid YouTube APK"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AinuboX1-v40-YOUTUBE-HYBRID-SWITCH
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
