name: Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "scripts/apply-nubo-sense-v25-native-tap.py"
      - "scripts/apply-nubo-sense-v26-main-voice.py"
      - "scripts/apply-nubo-sense-v27-hide-debug.py"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "scripts/apply-nubo-sense-v25-native-tap.py"
      - "scripts/apply-nubo-sense-v26-main-voice.py"
      - "scripts/apply-nubo-sense-v27-hide-debug.py"

permissions:
  contents: write

jobs:
  build-stable-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize stable AinuboX1 signing key
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo

      - name: Materialize and verify uploaded AinuboX1 launcher icon
        run: |
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          test "$(xxd -p -l 3 android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg)" = "ffd8ff"
          grep -q 'JPEG image data' <(file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg)
          grep -q 'ainubox1_launcher_uploaded' android-nubo/app/src/main/AndroidManifest.xml

      - name: Apply V27 Sense hidden-diagnostics build
        run: python3 scripts/apply-nubo-sense-v27-hide-debug.py

      - name: Build signed AinuboX1 V27 NUBO Sense release APK
        run: gradle -p android-nubo clean assembleRelease --stacktrace

      - name: Verify APK signature, package and actual packaged icon
        run: |
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/ainubox1-badging.txt | head -n 8
          grep -q "versionCode='27'" /tmp/ainubox1-badging.txt
          grep -q "application-label:'AinuboX1'" /tmp/ainubox1-badging.txt
          ICON_PATH=$(sed -n "s/^application-icon-160:'\([^']*\)'.*/\1/p" /tmp/ainubox1-badging.txt | head -n1)
          test -n "$ICON_PATH"
          echo "Packaged launcher icon: $ICON_PATH"
          unzip -p "$APK" "$ICON_PATH" > /tmp/packaged-launcher-icon
          test "$(xxd -p -l 3 /tmp/packaged-launcher-icon)" = "ffd8ff"
          grep -q 'JPEG image data' <(file /tmp/packaged-launcher-icon)
          unzip -l "$APK" | grep -q 'assets/yamnet.tflite'

      - name: Publish V27 NUBO Sense APK
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-v27-NUBO-SENSE.apk
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AinuboX1-v27-NUBO-SENSE.apk public/downloads/AinuboX1-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish AinuboX1 V27 NUBO Sense APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v27-NUBO-SENSE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
