name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - "lib/mobile-direct-app-v4.ts"
      - "lib/nubo-smart-noise.ts"
      - "lib/nubo-realtime-eco.ts"
      - "lib/browser-audio.ts"
      - "components/NuboSmartNoiseRuntime.tsx"
      - "components/OpenAIRealtimeVoiceConsole.tsx"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android-nubo assembleDebug --stacktrace

      - name: Publish APK into NUBO web downloads
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/debug/app-debug.apk public/downloads/nubo-android-v11.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/nubo-android-v11.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build(android): publish NUBO V11 smart-token APK"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nubo-android-v11-debug
          path: android-nubo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
