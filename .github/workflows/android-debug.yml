name: Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build-stable-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize stable AinuboX1 signing key
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo

      - name: Materialize uploaded AinuboX1 launcher icon
        run: |
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo.png.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          test -s android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          grep -q 'ainubox1_launcher_uploaded' android-nubo/app/src/main/AndroidManifest.xml

      - name: Build signed AinuboX1 V18 release APK
        run: gradle -p android-nubo assembleRelease --stacktrace

      - name: Verify APK signature and package
        run: |
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/ainubox1-badging.txt | head -n 8
          grep -q "versionCode='18'" /tmp/ainubox1-badging.txt
          unzip -l "$APK" | grep -q 'ainubox1_launcher_uploaded.png'

      - name: Publish V18 APK
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-v18-UPLOADED-N.apk
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AinuboX1-v18-UPLOADED-N.apk public/downloads/AinuboX1-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish AinuboX1 V18 uploaded-logo APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v18-UPLOADED-N
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
