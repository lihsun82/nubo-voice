name: Android Stable APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "scripts/apply-nubo-sense-v25-native-tap.py"
      - "scripts/apply-nubo-sense-v26-main-voice.py"
      - "scripts/apply-nubo-sense-v27-hide-debug.py"
      - "scripts/apply-nubo-v28-build.py"
      - "scripts/apply-google-home-v29.py"
      - "scripts/apply-youtube-switch-v30.py"
      - "scripts/apply-youtube-switch-v31-force-reset.py"
      - "scripts/apply-youtube-switch-v32-exact-video.py"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"
      - "scripts/apply-nubo-sense-v25-native-tap.py"
      - "scripts/apply-nubo-sense-v26-main-voice.py"
      - "scripts/apply-nubo-sense-v27-hide-debug.py"
      - "scripts/apply-nubo-v28-build.py"
      - "scripts/apply-google-home-v29.py"
      - "scripts/apply-youtube-switch-v30.py"
      - "scripts/apply-youtube-switch-v31-force-reset.py"
      - "scripts/apply-youtube-switch-v32-exact-video.py"

permissions:
  contents: write

jobs:
  build-stable-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize stable AinuboX1 signing key
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo

      - name: Materialize and verify AinuboX1 launcher icon
        run: |
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          test "$(xxd -p -l 3 android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg)" = "ffd8ff"
          grep -q 'JPEG image data' <(file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg)
          grep -q 'ainubox1_launcher_uploaded' android-nubo/app/src/main/AndroidManifest.xml

      - name: Download official Google Home Android SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          HOME_SDK_ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          HOME_SDK_REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 \
            'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' \
            -o "$HOME_SDK_ZIP"
          test "$(stat -c%s "$HOME_SDK_ZIP")" -gt 100000000
          mkdir -p "$HOME_SDK_REPO"
          unzip -q "$HOME_SDK_ZIP" -d "$HOME_SDK_REPO"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home-types/17.1.0/play-services-home-types-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$HOME_SDK_REPO" >> "$GITHUB_ENV"

      - name: Apply unchanged V28 voice and UI build
        run: python3 scripts/apply-nubo-v28-build.py

      - name: Restore Google Home SDK 1.10.0 bridge only
        run: python3 scripts/apply-google-home-v29.py

      - name: Apply YouTube exact-video switching only
        run: python3 scripts/apply-youtube-switch-v32-exact-video.py

      - name: Verify isolated Google Home and V32 YouTube wiring
        run: |
          test -f android-nubo/app/src/main/java/com/ainubo/nubo/GoogleHomeActivity.java
          test -f android-nubo/app/src/main/java/com/ainubo/nubo/GoogleHomeGateway.java
          test -f android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'homeArtifact", "17.1.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'play-services-home:17.1.0' android-nubo/app/build.gradle
          grep -q 'play-services-home-types:17.1.0' android-nubo/app/build.gradle
          grep -q 'public String googleHomeStatus()' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'public boolean googleHomeControl' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'vnd.youtube:' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'FLAG_ACTIVITY_REORDER_TO_FRONT' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'v32-exact-video' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          ! grep -q 'v31-force-task-reset' android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java

      - name: Build signed AinuboX1 V32 YouTube exact-video APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify APK signature, package, Sense, Google Home and V32 payload
        run: |
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/ainubox1-badging.txt | head -n 8
          grep -q "versionCode='32'" /tmp/ainubox1-badging.txt
          grep -q "application-label:'AinuboX1'" /tmp/ainubox1-badging.txt
          ICON_PATH=$(sed -n "s/^application-icon-160:'\([^']*\)'.*/\1/p" /tmp/ainubox1-badging.txt | head -n1)
          test -n "$ICON_PATH"
          unzip -p "$APK" "$ICON_PATH" > /tmp/packaged-launcher-icon
          test "$(xxd -p -l 3 /tmp/packaged-launcher-icon)" = "ffd8ff"
          grep -q 'JPEG image data' <(file /tmp/packaged-launcher-icon)
          unzip -l "$APK" | grep -q 'assets/yamnet.tflite'
          unzip -l "$APK" | grep -q 'play-services-home.properties'
          unzip -l "$APK" | grep -q 'play-services-home-types.properties'
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v32-dex-strings.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v32-dex-strings.txt
          grep -q 'nubo:google-home-result' /tmp/v32-dex-strings.txt
          grep -q '17.1.0' /tmp/v32-dex-strings.txt
          grep -q 'vnd.youtube:' /tmp/v32-dex-strings.txt
          grep -q 'v32-exact-video' /tmp/v32-dex-strings.txt

      - name: Publish V32 YouTube exact-video APK
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-v32-YOUTUBE-EXACT-VIDEO.apk
          cp android-nubo/app/build/outputs/apk/release/app-release.apk public/downloads/AinuboX1-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AinuboX1-v32-YOUTUBE-EXACT-VIDEO.apk public/downloads/AinuboX1-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish AinuboX1 V32 YouTube exact-video APK"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AinuboX1-v32-YOUTUBE-EXACT-VIDEO
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
