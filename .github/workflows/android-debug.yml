name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - "lib/mobile-direct-app-v4.ts"
      - "lib/nubo-smart-noise.ts"
      - "lib/nubo-realtime-eco.ts"
      - "lib/browser-audio.ts"
      - "components/NuboSmartNoiseRuntime.tsx"
      - "components/OpenAIRealtimeVoiceConsole.tsx"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - ".github/workflows/android-debug.yml"

concurrency:
  group: ainubox1-android-debug-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare AinuboX1 launcher icon
        run: |
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          base64 --decode android-nubo/icon/ainubox1_icon.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_icon.jpg

      - name: Build debug APK
        run: gradle -p android-nubo assembleDebug --stacktrace

      - name: Publish APK into NUBO web downloads
        if: github.event_name == 'push'
        run: |
          mkdir -p public/downloads
          cp android-nubo/app/build/outputs/apk/debug/app-debug.apk public/downloads/AinuboX1-v12.apk
          cp android-nubo/app/build/outputs/apk/debug/app-debug.apk public/downloads/AinuboX1-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/AinuboX1-v12.apk public/downloads/AinuboX1-latest.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build(android): publish AinuboX1 V12 APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v12-debug
          path: android-nubo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
