name: NUBO Local Wake APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nubo-local-kws-wake-v1
    paths:
      - "android-wake/**"
      - ".github/workflows/android-local-wake.yml"

permissions:
  contents: read

jobs:
  build-local-wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install sherpa-onnx keyword tooling
        run: python -m pip install --disable-pip-version-check "sherpa-onnx==1.13.4" sentencepiece pypinyin

      - name: Fetch official sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wake/app/libs
          curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar" \
            -o android-wake/app/libs/sherpa-onnx-1.13.4.aar
          test -s android-wake/app/libs/sherpa-onnx-1.13.4.aar
          unzip -t android-wake/app/libs/sherpa-onnx-1.13.4.aar >/dev/null

      - name: Fetch official Chinese-English KWS model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ARCHIVE=/tmp/nubo-kws.tar.bz2
          curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2" \
            -o "$MODEL_ARCHIVE"
          echo "68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6  $MODEL_ARCHIVE" | sha256sum -c -
          mkdir -p android-wake/app/src/main/assets
          tar -xjf "$MODEL_ARCHIVE" -C android-wake/app/src/main/assets
          MODEL=android-wake/app/src/main/assets/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
          test -d "$MODEL"
          find "$MODEL" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Keep low-latency mobile model files and generate NUBO keywords
        shell: bash
        run: |
          set -euo pipefail
          MODEL=android-wake/app/src/main/assets/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20

          ENCODER="$MODEL/encoder-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
          DECODER="$MODEL/decoder-epoch-13-avg-2-chunk-8-left-64.onnx"
          JOINER="$MODEL/joiner-epoch-13-avg-2-chunk-8-left-64.int8.onnx"
          TOKENS="$MODEL/tokens.txt"
          LEXICON="$MODEL/en.phone"

          test -f "$ENCODER"
          test -f "$DECODER"
          test -f "$JOINER"
          test -f "$TOKENS"
          test -f "$LEXICON"

          if ! grep -qE '^NUBO[[:space:]]' "$LEXICON"; then
            printf '\nNUBO N UW1 B OW0\n' >> "$LEXICON"
          fi

          cat > "$MODEL/keywords_raw.txt" <<'EOF'
          NUBO :3.0 #0.20 @NUBO
          HEY NUBO :3.2 #0.18 @HEY_NUBO
          HI NUBO :3.2 #0.18 @HI_NUBO
          努波 :3.0 #0.20 @努波
          嘿努波 :3.2 #0.18 @嘿努波
          哈囉努波 :3.2 #0.18 @哈囉努波
          你好努波 :3.2 #0.18 @你好努波
          喂努波 :3.2 #0.18 @喂努波
          EOF

          if ! sherpa-onnx-cli text2token \
            --tokens "$TOKENS" \
            --tokens-type phone+ppinyin \
            --lexicon "$LEXICON" \
            "$MODEL/keywords_raw.txt" "$MODEL/keywords.txt"; then
            echo "Full Traditional-Chinese phrase set was not tokenizable; applying conservative fallback."
            cat > "$MODEL/keywords_raw.txt" <<'EOF'
          NUBO :3.0 #0.20 @NUBO
          HEY NUBO :3.2 #0.18 @HEY_NUBO
          HI NUBO :3.2 #0.18 @HI_NUBO
          努波 :3.0 #0.20 @努波
          嘿努波 :3.2 #0.18 @嘿努波
          你好努波 :3.2 #0.18 @你好努波
          喂努波 :3.2 #0.18 @喂努波
          EOF
            sherpa-onnx-cli text2token \
              --tokens "$TOKENS" \
              --tokens-type phone+ppinyin \
              --lexicon "$LEXICON" \
              "$MODEL/keywords_raw.txt" "$MODEL/keywords.txt"
          fi

          test -s "$MODEL/keywords.txt"
          echo "Generated wake keywords:"
          cat "$MODEL/keywords.txt"

          find "$MODEL" -maxdepth 1 -type f \( -name '*.onnx' -o -name '*.bin' -o -name '*.pt' \) \
            ! -name 'encoder-epoch-13-avg-2-chunk-8-left-64.int8.onnx' \
            ! -name 'decoder-epoch-13-avg-2-chunk-8-left-64.onnx' \
            ! -name 'joiner-epoch-13-avg-2-chunk-8-left-64.int8.onnx' \
            -delete

      - name: Build NUBO Wake debug APK
        run: gradle -p android-wake clean assembleDebug --stacktrace

      - name: Verify package and foreground microphone service
        shell: bash
        run: |
          set -euo pipefail
          APK=android-wake/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/nubo-wake-badging.txt | head -n 12
          grep -q "package: name='com.ainubo.nubowake'" /tmp/nubo-wake-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/nubo-wake-manifest.txt
          grep -q 'com.ainubo.nubowake.WakeService' /tmp/nubo-wake-manifest.txt
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: NUBO-Wake-v1-LOCAL-KWS-TEST
          path: android-wake/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
