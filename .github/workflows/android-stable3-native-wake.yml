name: NUBO 3.2 Background Voice + YouTube Switch APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-nubo-stable-3-audiorecord-wake.py"
      - "scripts/apply-nubo-youtube-background-cloud-mic-v31.py"
      - "scripts/apply-nubo-youtube-background-switch-v32.py"
      - ".github/workflows/android-stable3-native-wake.yml"

permissions:
  contents: read

jobs:
  build-stable-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize Stable 3 + Google Home + background Gemini + YouTube switch
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-nubo-stable-3-audiorecord-wake.py
          node scripts/apply-web-stable-2-native-wake.mjs
          node scripts/apply-web-stable-2-shutdown.mjs
          python3 scripts/apply-nubo-youtube-background-cloud-mic-v31.py
          python3 scripts/apply-nubo-youtube-background-switch-v32.py

      - name: Verify 3.2 architecture
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          NATIVE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboNativeWakeService.java
          YT=android-nubo/app/src/main/java/com/ainubo/nubo/NuboYouTubeAccessibilityService.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          WEB=components/GeminiVoiceConsole.tsx
          grep -q 'versionCode 3200' android-nubo/app/build.gradle
          grep -q '3.2.0-youtube-background-voice-switch' android-nubo/app/build.gradle
          grep -q 'prepareYouTubeBackgroundCloud' "$MAIN"
          grep -q 'isBackgroundCloudMode' "$MAIN"
          grep -q 'requestSongSwitch' "$MAIN"
          grep -q 'openYouTubeControlSettings' "$MAIN"
          grep -q 'dispatchBackgroundPcmFromService' "$MAIN"
          grep -q 'backgroundCloudCaptureLoop' "$NATIVE"
          grep -q 'AudioRecord' "$NATIVE"
          grep -q 'ACTION_SET_TEXT' "$YT"
          grep -q 'dispatchGesture' "$YT"
          grep -q 'NuboYouTubeAccessibilityService' "$MANIFEST"
          grep -q 'BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -q 'foregroundServiceType="microphone"' "$MANIFEST"
          grep -q 'NUBO_NATIVE_BACKGROUND_PCM_V31' "$WEB"
          grep -q 'nubo:native-background-pcm' "$WEB"
          grep -q 'sdk", "1.10.0"' "$HOME"
          npm run typecheck

      - name: Build signed NUBO 3.2 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed NUBO 3.2 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/nubo32.txt
          grep -q "versionCode='3200'" /tmp/nubo32.txt
          grep -q "versionName='3.2.0-youtube-background-voice-switch'" /tmp/nubo32.txt
          unzip -l "$APK" | grep -q 'assets/model-cn-small/am/final.mdl'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/nubo32-manifest.txt
          grep -q 'NuboYouTubeAccessibilityService' /tmp/nubo32-manifest.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/nubo32-dex.txt
          grep -q 'NuboNativeWakeV3' /tmp/nubo32-dex.txt
          grep -q 'ACTION_BACKGROUND_CLOUD' /tmp/nubo32-dex.txt
          grep -q 'NuboYouTubeAccessibilityService' /tmp/nubo32-dex.txt
          grep -q 'requestSongSwitch' /tmp/nubo32-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/nubo32-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-NUBO-3.2-BACKGROUND-VOICE-YOUTUBE-SWITCH
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
