name: NUBO 3.3 No-Setup Background YouTube APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-nubo-stable-3-audiorecord-wake.py"
      - "scripts/apply-nubo-youtube-background-cloud-mic-v31.py"
      - "scripts/apply-nubo-youtube-background-nosetup-v33.py"
      - ".github/workflows/android-stable3-native-wake.yml"

permissions:
  contents: read

jobs:
  build-stable-3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install web dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Materialize signing key and launcher icon
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Materialize Stable 3 + Google Home + native background PCM + no-setup YouTube
        run: |
          set -euo pipefail
          python3 scripts/apply-nubo-v28-build.py
          python3 scripts/apply-google-home-v29.py
          python3 scripts/apply-nubo-stable-3-audiorecord-wake.py
          node scripts/apply-web-stable-2-native-wake.mjs
          node scripts/apply-web-stable-2-shutdown.mjs
          python3 scripts/apply-nubo-youtube-background-cloud-mic-v31.py
          python3 scripts/apply-nubo-youtube-background-nosetup-v33.py

      - name: Verify 3.3 architecture and routing contracts
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          NATIVE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboNativeWakeService.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          HOME=android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          WEB=components/GeminiVoiceConsole.tsx
          grep -q 'versionCode 3300' android-nubo/app/build.gradle
          grep -q '3.3.0-youtube-background-nosetup' android-nubo/app/build.gradle
          grep -q 'dispatchBackgroundPcmFromService' "$MAIN"
          grep -q 'beginExternalVoiceKeepAlive();' "$MAIN"
          grep -q 'ACTION_BACKGROUND_CLOUD' "$NATIVE"
          grep -q 'backgroundCloudCaptureLoop' "$NATIVE"
          grep -q 'AudioRecord' "$NATIVE"
          grep -q 'foregroundServiceType="microphone"' "$MANIFEST"
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$MANIFEST"
          grep -q 'NUBO_NATIVE_BACKGROUND_PCM_V31' "$WEB"
          grep -q 'nubo:native-background-pcm' "$WEB"
          grep -q 'realtimeInput' "$WEB"
          ! grep -q 'NuboYouTubeAccessibilityService' "$MANIFEST"
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          ! grep -q 'NotificationListenerService' "$MANIFEST"
          ! grep -q 'SYSTEM_ALERT_WINDOW' "$MANIFEST"
          test ! -e android-nubo/app/src/main/java/com/ainubo/nubo/NuboYouTubeAccessibilityService.java
          grep -q 'launchYouTubeNoSetupV33' "$MAIN"
          grep -q 'FLAG_ACTIVITY_MULTIPLE_TASK' "$MAIN"
          grep -q 'INTENT_ACTION_VIDEO_PLAY_FROM_SEARCH' "$MAIN"
          grep -q 'INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH' "$MAIN"
          grep -q '650L' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          s = Path('android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java').read_text()
          a = s.index('public boolean playYouTubeNoSetup(')
          b = s.index('public boolean isExternalVoiceKeepAliveActive()', a)
          block = s[a:b]
          assert block.index('beginExternalVoiceKeepAlive();') < block.index('launchYouTubeNoSetupV33'), 'mic handoff must precede YouTube launch'
          assert '650L' in block, 'handoff delay missing'
          print('V3.3 bridge ordering contract: PASS')
          PY
          grep -q 'public boolean googleHomeControl' "$MAIN"
          grep -q 'sdk", "1.10.0"' "$HOME"
          grep -q 'homeArtifact", "17.1.0"' "$HOME"
          npm run typecheck

      - name: Build signed NUBO 3.3 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify signed NUBO 3.3 APK payload
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/nubo33.txt
          grep -q "versionCode='3300'" /tmp/nubo33.txt
          grep -q "versionName='3.3.0-youtube-background-nosetup'" /tmp/nubo33.txt
          unzip -l "$APK" | grep -q 'assets/model-cn-small/am/final.mdl'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/nubo33-manifest.txt
          ! grep -q 'NuboYouTubeAccessibilityService' /tmp/nubo33-manifest.txt
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' /tmp/nubo33-manifest.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/nubo33-dex.txt
          grep -q 'NuboNativeWakeV3' /tmp/nubo33-dex.txt
          grep -q 'ACTION_BACKGROUND_CLOUD' /tmp/nubo33-dex.txt
          grep -q 'v33-background-nosetup' /tmp/nubo33-dex.txt
          grep -q 'android.media.action.VIDEO_PLAY_FROM_SEARCH' /tmp/nubo33-dex.txt
          grep -q 'android.media.action.MEDIA_PLAY_FROM_SEARCH' /tmp/nubo33-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/nubo33-dex.txt

      - name: Android 15 emulator install and foreground-service smoke test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          dump_debug() {
            echo '===== emulator.log ====='
            tail -n 200 /tmp/emulator.log 2>/dev/null || true
            echo '===== adb devices ====='
            adb devices -l || true
            echo '===== service state ====='
            cat /tmp/nubo-services.txt 2>/dev/null || true
            echo '===== NUBO logcat ====='
            adb logcat -d -t 500 2>/dev/null | grep -E 'com\.ainubo\.nubo|NuboNativeWakeService|ForegroundServiceStartNotAllowedException|SecurityException|FATAL EXCEPTION' || true
          }
          trap 'rc=$?; if [ $rc -ne 0 ]; then dump_debug; fi; exit $rc' EXIT
          timeout 360s sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          printf 'no\n' | avdmanager create avd -n nuboApi35 -k "system-images;android-35;google_apis;x86_64" --force >/dev/null
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup emulator -avd nuboApi35 -no-window -no-audio -no-metrics -gpu swiftshader_indirect -no-snapshot -no-boot-anim > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          timeout 180s adb wait-for-device
          BOOTED=0
          for i in $(seq 1 90); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then BOOTED=1; break; fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo 'Emulator exited before boot'; exit 1; fi
            sleep 2
          done
          test "$BOOTED" = "1"
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          adb install -r "$APK"
          adb shell pm grant com.ainubo.nubo android.permission.RECORD_AUDIO || true
          adb logcat -c
          adb shell am start -W -n com.ainubo.nubo/.MainActivity
          sleep 3
          adb shell am start-foreground-service -n com.ainubo.nubo/.NuboNativeWakeService -a com.ainubo.nubo.action.NATIVE_WAKE_ARM
          sleep 3
          adb shell dumpsys activity services com.ainubo.nubo > /tmp/nubo-services.txt
          grep -q 'NuboNativeWakeService' /tmp/nubo-services.txt
          if adb logcat -d | grep -E 'FATAL EXCEPTION.*com\.ainubo\.nubo|ForegroundServiceStartNotAllowedException|SecurityException:.*NuboNativeWakeService'; then
            echo 'NUBO foreground-service smoke test found a runtime failure'
            exit 1
          fi
          echo 'Android 15 install + native foreground-service smoke: PASS'
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-NUBO-3.3-NO-SETUP-BACKGROUND-YOUTUBE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
