name: Production Guest Audio Semantic LINE E2E

on:
  push:
    branches:
      - diag/prod-line-e2e-20260914

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Mandarin guest request and call production audio API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          espeak-ng -v cmn -s 135 -w guest.wav '幫我送兩條毛巾到三零五房'
          ffmpeg -hide_banner -loglevel error -y -i guest.wav -ac 1 -ar 16000 -f s16le guest.pcm
          python3 - <<'PY' > payload.json
          import base64, json
          pcm = open('guest.pcm','rb').read()
          print(json.dumps({
              'pcmBase64': base64.b64encode(pcm).decode(),
              'sampleRate': 16000,
              'source': 'prod-audio-semantic-line-e2e-20260914',
          }, ensure_ascii=False))
          PY
          out=$(mktemp)
          code=$(curl -sS --max-time 100 -o "$out" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            https://nubo-cloud.onrender.com/api/notify/guest-service-audio)
          cat "$out"
          echo
          echo "HTTP_STATUS=$code"
          test "$code" = "200"
          grep -Eq '"(sent|duplicate)":true' "$out"
