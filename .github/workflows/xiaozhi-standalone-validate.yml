name: Validate Xiaozhi Standalone Image

on:
  push:
    branches:
      - hybrid-cloud-v1
    paths:
      - "deploy/xiaozhi-standalone/**"
      - ".github/workflows/xiaozhi-standalone-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout NUBO
        uses: actions/checkout@v4

      - name: Build isolated Xiaozhi image
        run: docker build --pull --file deploy/xiaozhi-standalone/Dockerfile --tag nubo-xiaozhi:validate .
