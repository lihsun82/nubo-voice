name: Android V47 Clean YouTube APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/api/youtube/open/route.ts"
      - "lib/youtube-clean-v47.ts"
      - "scripts/apply-youtube-clean-v47.py"
      - ".github/workflows/android-v47-youtube-clean.yml"

permissions:
  contents: read

jobs:
  build-v47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck V47 web route
        run: npx tsc --noEmit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-youtube-clean-v47.py

      - name: Verify V47 clean scope
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'versionCode 47' android-nubo/app/build.gradle
          grep -q '0.47.0-youtube-clean-single-route' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/47' "$MAIN"
          grep -q 'android-v47' "$MAIN"
          grep -q 'nubo_v47_bundle_flushed' "$MAIN"
          grep -q 'public boolean playYouTubeNoSetup' "$MAIN"
          grep -q 'public boolean googleHomeControl' "$MAIN"
          grep -q 'resolveCleanYouTubeV47' app/api/youtube/open/route.ts
          grep -q 'youtube-clean-single-route-v47' lib/youtube-clean-v47.ts
          ! grep -q 'searchHighQualityYouTubeVideo' app/api/youtube/open/route.ts
          ! grep -q 'resolveYouTubeAppVideoV46' app/api/youtube/open/route.ts
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V47 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V47 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v47.txt
          grep -q "versionCode='47'" /tmp/v47.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v47-dex.txt
          grep -q 'NUBO-Android/47' /tmp/v47-dex.txt
          grep -q 'com.google.android.youtube' /tmp/v47-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v47-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v47-YOUTUBE-CLEAN-RESTART
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
