name: Android V53 YouTube Background KeepAlive APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/app/src/main/java/com/ainubo/nubo/NuboBackgroundListeningService.java"
      - "scripts/apply-youtube-v53-background-keepalive-fix.py"
      - ".github/workflows/android-v51-youtube-exact-play.yml"
  push:
    branches: [main]
    paths:
      - "android-nubo/app/src/main/java/com/ainubo/nubo/NuboBackgroundListeningService.java"
      - "scripts/apply-youtube-v53-background-keepalive-fix.py"
      - ".github/workflows/android-v51-youtube-exact-play.yml"

permissions:
  contents: read

jobs:
  build-v53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-youtube-v53-background-keepalive-fix.py

      - name: Verify V53 background keepalive fix
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          SERVICE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboBackgroundListeningService.java
          grep -q 'versionCode 53' android-nubo/app/build.gradle
          grep -q '0.53.0-youtube-background-keepalive-fix' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/53' "$MAIN"
          grep -q 'startCompanionListeningV53' "$MAIN"
          grep -q 'externalVoiceKeepAliveActive = true' "$MAIN"
          grep -q 'NuboBackgroundListeningService.isCloudWindowActive()' "$MAIN"
          grep -q 'MainActivity.onCompanionTimeoutFromServiceV53' "$SERVICE"
          ! grep -q 'sendBroadcast(timeout)' "$SERVICE"
          grep -q 'startNativeWakeListener();' "$MAIN"
          grep -q 'handleCompanionWakeV53();' "$MAIN"
          grep -q 'AudioManager.MODE_NORMAL' "$MAIN"
          grep -q 'YOUTUBE_RELAUNCH_GUARD_MS = 60_000L' "$MAIN"
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$MANIFEST"
          grep -q 'foregroundServiceType="microphone"' "$MANIFEST"
          grep -q 'ACTIVE_WINDOW_MS = 30_000L' "$SERVICE"
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V53 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V53 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v53.txt
          grep -q "versionCode='53'" /tmp/v53.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v53-dex.txt
          grep -q 'NUBO-Android/53' /tmp/v53-dex.txt
          grep -q 'NuboBackgroundListeningService' /tmp/v53-dex.txt
          grep -q 'android-v53' /tmp/v53-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v53-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v53-YOUTUBE-BACKGROUND-KEEPALIVE
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
