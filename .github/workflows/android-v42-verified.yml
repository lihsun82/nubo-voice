name: Android V42 Verified YouTube APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - "components/NuboBuildFooter.tsx"
      - "app/page.tsx"
      - "scripts/apply-youtube-verified-launch-v42.py"
      - ".github/workflows/android-v42-verified.yml"
  push:
    branches: [main]
    paths:
      - "android-nubo/**"
      - "components/NuboBuildFooter.tsx"
      - "app/page.tsx"
      - "scripts/apply-youtube-verified-launch-v42.py"
      - ".github/workflows/android-v42-verified.yml"

permissions:
  contents: write

jobs:
  build-v42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          HOME_SDK_ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          HOME_SDK_REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$HOME_SDK_ZIP"
          mkdir -p "$HOME_SDK_REPO"
          unzip -q "$HOME_SDK_ZIP" -d "$HOME_SDK_REPO"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$HOME_SDK_REPO" >> "$GITHUB_ENV"

      - name: Apply V28 baseline
        run: python3 scripts/apply-nubo-v28-build.py

      - name: Restore Google Home SDK 1.10.0
        run: python3 scripts/apply-google-home-v29.py

      - name: Apply V42 verified YouTube launch
        run: python3 scripts/apply-youtube-verified-launch-v42.py

      - name: Verify V42 architecture
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'NUBO-Android/42' "$MAIN"
          grep -q 'android-v42' "$MAIN"
          grep -q 'v42-vnd-youtube-direct' "$MAIN"
          grep -q 'vnd.youtube:' "$MAIN"
          grep -q 'AtomicBoolean launchAccepted' "$MAIN"
          grep -q 'CountDownLatch launchLatch' "$MAIN"
          grep -q 'return launchAccepted.get()' "$MAIN"
          grep -q 'private boolean launchExactYouTubeVideo' "$MAIN"
          grep -q 'setAutoEnterEnabled(true)' "$MAIN"
          grep -q 'NuboYouTubeAccessibilityService.requestSongSwitch(uiQuery)' "$MAIN"
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt
          grep -q 'homeArtifact", "17.1.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V42 release APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V42 APK payload
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v42-badging.txt
          grep -q "versionCode='42'" /tmp/v42-badging.txt
          grep -q "application-label:'AinuboX1'" /tmp/v42-badging.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v42-dex.txt
          grep -q 'NUBO-Android/42' /tmp/v42-dex.txt
          grep -q 'android-v42' /tmp/v42-dex.txt
          grep -q 'v42-vnd-youtube-direct' /tmp/v42-dex.txt
          grep -q 'vnd.youtube:' /tmp/v42-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v42-dex.txt
          grep -q '17.1.0' /tmp/v42-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v42-YOUTUBE-VERIFIED-LAUNCH
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
