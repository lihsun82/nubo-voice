name: One-shot NUBO orange density spread

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-orange-density-spread.yml'

permissions:
  contents: write

jobs:
  patch-orange-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increase face particles and spread neck energy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('components/NuboEnergyOrb.tsx')
          s = target.read_text(encoding='utf-8')

          replacements = [
              ('for (let i = 0; i < 188; i += 1) {', 'for (let i = 0; i < 244; i += 1) {'),
              ('const neckGlow = ctx.createRadialGradient(cx, 365, 8, cx, 365, 92);', 'const neckGlow = ctx.createRadialGradient(cx, 365, 8, cx, 365, 116);'),
              ('ctx.fillRect(cx - 110, 270, 220, 205);', 'ctx.fillRect(cx - 135, 265, 270, 215);'),
              ('const spread = 8 + branch * 5.1;', 'const spread = 11 + branch * 6.4;'),
              ('ctx.moveTo(cx + side * (15 + branch * 2), 281 + branch * 1.3);', 'ctx.moveTo(cx + side * (18 + branch * 2.5), 281 + branch * 1.3);'),
              ('cx + side * (23 + spread * 0.72),', 'cx + side * (23 + spread * 0.9),'),
              ('cx + side * (18 + spread * 0.55),', 'cx + side * (18 + spread * 0.7),'),
              ('cx + side * (16 + spread * 0.46),', 'cx + side * (16 + spread * 0.6),'),
              ('cx + side * (12 + spread * 0.3),', 'cx + side * (12 + spread * 0.42),'),
              ('cx + side * (8 + spread * 0.16),', 'cx + side * (8 + spread * 0.25),'),
              ('cx + side * (6 + branch * 1.2),', 'cx + side * (9 + branch * 1.65),'),
              ('ctx.moveTo(cx + stem * 4.4, 331);', 'ctx.moveTo(cx + stem * 6.2, 331);'),
              ('cx + stem * 3.5,', 'cx + stem * 5.0,'),
              ('cx + stem * 2.4,', 'cx + stem * 3.6,'),
              ('cx + stem * 1.8,', 'cx + stem * 2.8,'),
              ('const spread = (1 - p) * 27 + 5;', 'const spread = (1 - p) * 40 + 7;'),
              ('const x = cx + side * spread * (0.35 + seededRandom(i + 1151) * 0.72);', 'const x = cx + side * spread * (0.45 + seededRandom(i + 1151) * 0.9);'),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)

          target.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/one-shot-orange-density-spread.yml
          git config user.name "NUBO Build Bot"
          git config user.email "84670777+lihsun82@users.noreply.github.com"
          git add components/NuboEnergyOrb.tsx .github/workflows/one-shot-orange-density-spread.yml
          git commit -m "tune(web): increase face orange particles and widen neck energy spread"
          git push origin HEAD:main
