name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify onsite PMS sales voice and live inventory safety
        run: node --experimental-strip-types --test tests/onsite-pms-voice-sales.test.mjs tests/nubosci-voice-session.test.mjs tests/main-voice-room-types.test.mjs tests/pms-live-guest-booking.test.mjs
