name: Build NUBO Fold Glass v0.1

on:
  push:
    branches: [ nubo-fold-glass-build-v01 ]
    paths:
      - 'nubo-fold-glass/**'
      - '.github/workflows/build-nubo-fold-glass-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nubo-fold-glass

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NUBO-Fold-Glass-v0.1-debug
          path: nubo-fold-glass/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
