name: Android V25 GoogleHome Wake Silent

on:
  push:
    branches:
      - fix/v22-1-googlehome-line-wake-20260913
    paths:
      - "android-nubo/**"
      - "scripts/apply-android-v25-googlehome-wake.py"
      - ".github/workflows/android-v25-googlehome-wake.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-nubo/**"
      - "scripts/apply-android-v25-googlehome-wake.py"
      - ".github/workflows/android-v25-googlehome-wake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v25:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize AinuboX1 signing key and launcher
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo >/dev/null
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg
          file android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg | grep -q 'JPEG image data'

      - name: Download official Google Home Android SDK 1.10.0
        shell: bash
        run: |
          set -euo pipefail
          HOME_SDK_ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          HOME_SDK_REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$HOME_SDK_ZIP"
          test "$(stat -c%s "$HOME_SDK_ZIP")" -gt 100000000
          mkdir -p "$HOME_SDK_REPO"
          unzip -q "$HOME_SDK_ZIP" -d "$HOME_SDK_REPO"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          test -f "$HOME_SDK_REPO/com/google/android/gms/play-services-home-types/17.1.0/play-services-home-types-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$HOME_SDK_REPO" >> "$GITHUB_ENV"

      - name: Download offline Vosk Chinese wake model
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/vosk-model-small-cn-0.22.zip"
          TMP="$RUNNER_TEMP/vosk-model"
          TARGET="android-nubo/app/src/main/assets/model-cn-small"
          curl -L --fail --retry 3 'https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip' -o "$ZIP"
          test "$(stat -c%s "$ZIP")" -gt 30000000
          rm -rf "$TMP" "$TARGET"
          mkdir -p "$TMP" "$(dirname "$TARGET")"
          unzip -q "$ZIP" -d "$TMP"
          mv "$TMP/vosk-model-small-cn-0.22" "$TARGET"
          test -f "$TARGET/conf/model.conf"
          test -d "$TARGET/am"
          test -d "$TARGET/graph"

      - name: Materialize V25 Google Home + silent native wake only
        run: python3 scripts/apply-android-v25-googlehome-wake.py

      - name: Verify scoped Android architecture before build
        shell: bash
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          WAKE=android-nubo/app/src/main/java/com/ainubo/nubo/NuboNativeWakeService.java
          MANIFEST=android-nubo/app/src/main/AndroidManifest.xml
          APP=android-nubo/app/build.gradle

          grep -q 'extends GoogleHomeActivity' "$MAIN"
          grep -q 'public String googleHomeStatus()' "$MAIN"
          grep -q 'googleHomeRequestPermissions' "$MAIN"
          grep -q 'googleHomeListDevices' "$MAIN"
          grep -q 'googleHomeControl' "$MAIN"
          grep -q 'NUBO-Android/25' "$MAIN"
          grep -q 'android-v25' "$MAIN"

          grep -q 'NuboNativeWakeService' "$MANIFEST"
          grep -q 'foregroundServiceType="microphone"' "$MANIFEST"
          grep -q 'AudioRecord' "$WAKE"
          grep -q 'VOICE_RECOGNITION' "$WAKE"
          grep -q 'acceptWaveForm' "$WAKE"
          grep -q 'classifyPcm16' "$WAKE"
          grep -q 'channel.setSound(null, null)' "$WAKE"
          ! grep -q 'SpeechRecognizer' "$MAIN"
          ! grep -q 'SpeechRecognizer' "$WAKE"
          ! grep -q 'ToneGenerator' "$WAKE"

          grep -q 'play-services-home:17.1.0' "$APP"
          grep -q 'vosk-android:0.3.75@aar' "$APP"

          # Existing unrelated Android capabilities must still exist.
          test -f android-nubo/app/src/main/java/com/ainubo/nubo/NuboSenseAudioDetector.java
          test -f android-nubo/app/src/main/java/com/ainubo/nubo/NuboYouTubeAccessibilityService.java
          test -f android-nubo/app/src/main/res/xml/nubo_youtube_accessibility_service.xml

      - name: Build signed AinuboX1 Android V25
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V25 APK payload and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v25-badging.txt
          grep -q "versionCode='25'" /tmp/v25-badging.txt
          grep -q "application-label:'AinuboX1'" /tmp/v25-badging.txt

          unzip -l "$APK" | grep -q 'assets/yamnet.tflite'
          unzip -l "$APK" | grep -q 'assets/model-cn-small/conf/model.conf'
          unzip -l "$APK" | grep -q 'play-services-home.properties'

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v25-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v25-dex.txt
          grep -q 'NuboNativeWakeService' /tmp/v25-dex.txt
          grep -q 'NUBO-Android/25' /tmp/v25-dex.txt
          grep -q 'android-v25' /tmp/v25-dex.txt
          grep -q 'nubo_native_wake_v25' /tmp/v25-dex.txt
          grep -q 'model-cn-small' /tmp/v25-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v25-GOOGLEHOME-WAKE-SILENT
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
