name: One-shot Gemini Live v1beta fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-gemini-live-v1beta-fix.yml'

permissions:
  contents: write

jobs:
  fix-gemini-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Gemini Live endpoint and stale socket handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/gemini-token/route.ts')
          r = route.read_text(encoding='utf-8-sig')
          old_token = 'https://generativelanguage.googleapis.com/v1alpha/auth_tokens'
          new_token = 'https://generativelanguage.googleapis.com/v1beta/auth_tokens'
          if old_token not in r:
              raise SystemExit('Expected v1alpha auth_tokens endpoint not found')
          r = r.replace(old_token, new_token)
          route.write_text(r, encoding='utf-8')

          console = Path('components/GeminiVoiceConsole.tsx')
          s = console.read_text(encoding='utf-8-sig')
          old_ws = 'google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained'
          new_ws = 'google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained'
          if old_ws not in s:
              raise SystemExit('Expected v1alpha Gemini Live websocket endpoint not found')
          s = s.replace(old_ws, new_ws)

          open_old = '''      socket.onopen = () => {\n        socket.send('''
          open_new = '''      socket.onopen = () => {\n        if (socketRef.current !== socket) return;\n        socket.send('''
          if open_old in s:
              s = s.replace(open_old, open_new, 1)

          msg_old = '''      socket.onmessage = async (event) => {\n        try {'''
          msg_new = '''      socket.onmessage = async (event) => {\n        if (socketRef.current !== socket) return;\n        try {'''
          if msg_old in s:
              s = s.replace(msg_old, msg_new, 1)

          err_old = '''      socket.onerror = () => {\n        setTranscript('''
          err_new = '''      socket.onerror = () => {\n        if (socketRef.current !== socket) return;\n        setTranscript('''
          if err_old in s:
              s = s.replace(err_old, err_new, 1)

          close_old = '''      socket.onclose = () => {\n        void microphoneRef.current?.stop();'''
          close_new = '''      socket.onclose = (event) => {\n        if (socketRef.current !== socket) return;\n        console.warn("NUBO Gemini Live socket closed", {\n          code: event.code,\n          reason: event.reason,\n          wasClean: event.wasClean,\n        });\n        void microphoneRef.current?.stop();'''
          if close_old not in s:
              raise SystemExit('Expected socket.onclose block not found')
          s = s.replace(close_old, close_new, 1)

          console.write_text(s, encoding='utf-8')
          PY
      - name: Commit connection fix
        shell: bash
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add app/api/gemini-token/route.ts components/GeminiVoiceConsole.tsx
          git commit -m 'fix(voice): migrate Gemini Live ephemeral connection to v1beta'
          git push origin HEAD:main
