name: One-shot Hologram V4 enable

on:
  push:
    paths:
      - '.github/workflows/one-shot-hologram-v4-enable.yml'

permissions:
  contents: write

jobs:
  enable-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update lockfile and switch voice consoles to V4
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          from pathlib import Path
          for name in ['components/GeminiVoiceConsole.tsx', 'components/OpenAIRealtimeVoiceConsole.tsx']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('import { NuboEnergyOrb } from "@/components/NuboEnergyOrb";', 'import { NuboHologram3D } from "@/components/NuboHologram3D";')
              s = s.replace('<NuboEnergyOrb />', '<NuboHologram3D />')
              p.write_text(s)
          PY
      - name: Commit V4 activation
        shell: bash
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add package-lock.json components/GeminiVoiceConsole.tsx components/OpenAIRealtimeVoiceConsole.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(web): activate Hologram V4 GPU 3D renderer'
          git push origin HEAD:main
