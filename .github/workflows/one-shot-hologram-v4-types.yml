name: One-shot Hologram V4 type fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-hologram-v4-types.yml'

permissions:
  contents: write

jobs:
  fix-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add Three.js typings and patch strict callbacks
        shell: bash
        run: |
          npm install --save-dev @types/three --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          from pathlib import Path
          p = Path('components/NuboHologram3D.tsx')
          s = p.read_text()
          s = s.replace('scene.traverse((object) => {', 'scene.traverse((object: THREE.Object3D) => {')
          s = s.replace('maybeMaterial.material.forEach((material) => material.dispose())', 'maybeMaterial.material.forEach((material: THREE.Material) => material.dispose())')
          p.write_text(s)
          PY
      - name: Commit type fix
        shell: bash
        run: |
          git config user.name 'NUBO Build Bot'
          git config user.email '84670777+lihsun82@users.noreply.github.com'
          git add package.json package-lock.json components/NuboHologram3D.tsx
          git commit -m 'fix(web): add Three.js types for Hologram V4'
          git push origin HEAD:main
