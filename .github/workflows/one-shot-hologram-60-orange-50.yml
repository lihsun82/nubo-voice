name: One-shot tune NUBO hologram particles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hologram-60-orange-50.yml"

permissions:
  contents: write

jobs:
  tune-hologram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact hologram tuning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/NuboEnergyOrb.tsx")
          text = path.read_text()
          original = text

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '  region: ParticleRegion;\n};',
              '  region: ParticleRegion;\n  speakingActive: boolean;\n};',
              'particle speakingActive type',
          )

          replace_once(
              '        region: "head",\n      };',
              '        region: "head",\n        speakingActive: seededRandom(index + 257) < 0.6,\n      };',
              'head speaking activation',
          )
          replace_once(
              '        region: "body",\n      };',
              '        region: "body",\n        speakingActive: seededRandom(index + 257) < 0.6,\n      };',
              'body speaking activation',
          )
          replace_once(
              '      region: "ambient",\n    };',
              '      region: "ambient",\n      speakingActive: seededRandom(index + 257) < 0.6,\n    };',
              'ambient speaking activation',
          )

          replace_once(
              '  // 512 orange particles: about +40%, still 70% small / 23% medium / 7% large.\n  for (let i = 0; i < 512; i += 1) {',
              '  // 768 orange particles: +50% from the previous 512-dot face core.\n  // Keep the same 70% small / 23% medium / 7% large distribution.\n  for (let i = 0; i < 768; i += 1) {',
              'face orange particle density',
          )

          replace_once(
              '    const speaking = speechLift > 0.01;\n    const speechPulse = speaking\n      ? 0.5 + 0.5 * Math.sin(t * 8.4 + particle.phase * 1.37)\n      : 0;',
              '    const speaking = speechLift > 0.01;\n    // Deterministic 60% cohort: these particles visibly jump and flare for\n    // the entire audio playback window. The other 40% keep their idle drift.\n    const speechActive = speaking && particle.speakingActive;\n    const speechPulse = speechActive\n      ? 0.5 + 0.5 * Math.sin(t * 8.4 + particle.phase * 1.37)\n      : 0;',
              '60 percent speech cohort',
          )

          replace_once(
              '      (speaking ? 1 + speechLift * 0.46 + speechPulse * 0.16 : 1);',
              '      (speechActive ? 1 + speechLift * 0.72 + speechPulse * 0.28 : 1);',
              'speech motion scale',
          )

          replace_once(
              '    const speechBounce = speaking\n      ? Math.sin(t * (6.2 + particle.flash * 0.8) + particle.phase) *\n        particle.depth *\n        (0.1 + speechLift * 0.34)\n      : 0;',
              '    const speechBounce = speechActive\n      ? Math.sin(t * (6.8 + particle.flash * 1.05) + particle.phase) *\n        particle.depth *\n        (1.45 + speechLift * 3.35)\n      : 0;',
              'visible speech bounce',
          )

          replace_once(
              '      (1 + speechLift * 0.82) *\n      (speaking ? 1 + speechPulse * 0.34 : 1);',
              '      (1 + speechLift * 0.46) *\n      (speechActive ? 1 + speechLift * 0.58 + speechPulse * 0.6 : 1);',
              'speech particle glow',
          )

          replace_once(
              '      (speaking && particle.size > 0.72 && flash > 0.72);',
              '      (speechActive && particle.size > 0.72 && flash > 0.62);',
              'active particle bright spark',
          )

          replace_once(
              '        (speaking ? 1 + speechPulse * 0.075 : 1),',
              '        (speechActive ? 1 + speechPulse * 0.13 : 1),',
              'active particle size pulse',
          )

          if text == original:
              raise SystemExit("No hologram changes were applied")

          path.write_text(text)
          PY

      - name: Verify requested tuning is present
        shell: bash
        run: |
          grep -q 'speakingActive: seededRandom(index + 257) < 0.6' components/NuboEnergyOrb.tsx
          test "$(grep -c 'speakingActive: seededRandom(index + 257) < 0.6' components/NuboEnergyOrb.tsx)" = "3"
          grep -q 'for (let i = 0; i < 768; i += 1)' components/NuboEnergyOrb.tsx
          grep -q 'const speechActive = speaking && particle.speakingActive' components/NuboEnergyOrb.tsx
          grep -q '1.45 + speechLift \* 3.35' components/NuboEnergyOrb.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Commit hologram tuning and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-hologram-60-orange-50.yml
          git add components/NuboEnergyOrb.tsx
          git commit -m "feat(hologram): animate 60% particles and boost face orange dots"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
