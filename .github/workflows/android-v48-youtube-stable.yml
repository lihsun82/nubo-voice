name: Android V48 Stable YouTube APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/youtube-stable-launch-v48.ts"
      - "lib/mobile-direct-app-v48-stable-adapter.ts"
      - "tsconfig.json"
      - "scripts/apply-youtube-stable-v48.py"
      - ".github/workflows/android-v48-youtube-stable.yml"
  push:
    branches: [main]
    paths:
      - "lib/youtube-stable-launch-v48.ts"
      - "lib/mobile-direct-app-v48-stable-adapter.ts"
      - "tsconfig.json"
      - "scripts/apply-youtube-stable-v48.py"
      - ".github/workflows/android-v48-youtube-stable.yml"

permissions:
  contents: read

jobs:
  build-v48:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck V48 web adapter
        run: npx tsc --noEmit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize signing key and launcher icon
        run: |
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo
          mkdir -p android-nubo/app/src/main/res/drawable-nodpi
          rm -f android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.png
          base64 --decode android-nubo/assets/ainubox1_uploaded_logo_v3.jpg.b64 > android-nubo/app/src/main/res/drawable-nodpi/ainubox1_launcher_uploaded.jpg

      - name: Download official Google Home SDK 1.10.0
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/home.android.sdk_1_10_0.zip"
          REPO="$RUNNER_TEMP/home-sdk-repo"
          curl -L --fail --retry 3 'https://storage.googleapis.com/home_sdk_android/home.android.sdk_1_10_0.zip' -o "$ZIP"
          mkdir -p "$REPO"
          unzip -q "$ZIP" -d "$REPO"
          test -f "$REPO/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          echo "NUBO_HOME_SDK_REPO=$REPO" >> "$GITHUB_ENV"

      - run: python3 scripts/apply-nubo-v28-build.py
      - run: python3 scripts/apply-google-home-v29.py
      - run: python3 scripts/apply-youtube-stable-v48.py

      - name: Verify V48 YouTube-only scope
        run: |
          set -euo pipefail
          MAIN=android-nubo/app/src/main/java/com/ainubo/nubo/MainActivity.java
          grep -q 'versionCode 48' android-nubo/app/build.gradle
          grep -q '0.48.0-youtube-stable-0801-launch' android-nubo/app/build.gradle
          grep -q 'NUBO-Android/48' "$MAIN"
          grep -q 'android-v48' "$MAIN"
          grep -q 'nubo_v48_bundle_flushed' "$MAIN"
          grep -q 'stable-2026-08-01-before-phone-agent-v2-bridge-fix' lib/mobile-direct-app-v48-stable-adapter.ts
          grep -q 'window.location.assign(launchUrl)' lib/youtube-stable-launch-v48.ts
          grep -q 'package=${packageName}' lib/youtube-stable-launch-v48.ts
          grep -q 'com.google.android.youtube' lib/youtube-stable-launch-v48.ts
          grep -q 'legacyForceDirectMobileOpen(result, callName)' lib/mobile-direct-app-v48-stable-adapter.ts
          grep -q 'sdk", "1.10.0"' android-nubo/app/src/googleHome/java/com/ainubo/nubo/googlehome/GoogleHomeGatewayImpl.kt

      - name: Build signed V48 APK
        run: gradle -p android-nubo clean assembleRelease -PnuboGoogleHome=true --stacktrace

      - name: Verify V48 APK
        run: |
          set -euo pipefail
          APK=android-nubo/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v48.txt
          grep -q "versionCode='48'" /tmp/v48.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/v48-dex.txt
          grep -q 'NUBO-Android/48' /tmp/v48-dex.txt
          grep -q 'com.google.android.youtube' /tmp/v48-dex.txt
          grep -q 'GoogleHomeGatewayImpl' /tmp/v48-dex.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-v48-YOUTUBE-STABLE-0801
          path: android-nubo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
