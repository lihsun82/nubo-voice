name: NUBO Sense V24 hotfix runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-run-nubo-sense-v24.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/nubo-sense-v24-hotfix
          path: target

      - name: Apply V24 patch
        run: |
          cd target
          python3 ../control/scripts/apply-nubo-sense-v24.py
          git checkout -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): NUBO Sense V24 live microphone detection"
          git push origin HEAD:agent/nubo-sense-v24-hotfix

      - name: Remove one-shot controller
        run: |
          cd control
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-run-nubo-sense-v24.yml scripts/apply-nubo-sense-v24.py
          git commit -m "chore: remove completed NUBO Sense V24 hotfix runner"
          git push origin HEAD:main
