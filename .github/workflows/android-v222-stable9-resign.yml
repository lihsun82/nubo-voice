name: Build V22.2.2 Stable9 Resigned APK

on:
  push:
    branches: [build/v222-installable-resign]
    paths:
      - ".github/workflows/android-v222-stable9-resign.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android signing tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download verified Stable 3 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AinuboX1-NUBO-STABLE-3.0-AUDIORECORD-NATIVE-WAKE
          path: base
          github-token: ${{ github.token }}
          repository: lihsun82/nubo-voice
          run-id: 31972445305

      - name: Patch only stable-3 to stable-9 without repacking ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp base/app-release.apk patched.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib

          path = Path('patched.apk')
          apk = bytearray(path.read_bytes())

          # Locate EOCD and central directory.
          eocd = apk.rfind(b'PK\x05\x06')
          if eocd < 0:
              raise SystemExit('EOCD not found')
          cd_offset = struct.unpack_from('<I', apk, eocd + 16)[0]
          cd_size = struct.unpack_from('<I', apk, eocd + 12)[0]

          # Find classes.dex central directory entry and local header.
          p = cd_offset
          dex_central = None
          dex_local = None
          while p < cd_offset + cd_size:
              if apk[p:p+4] != b'PK\x01\x02':
                  raise SystemExit(f'bad central directory signature at {p}')
              name_len, extra_len, comment_len = struct.unpack_from('<HHH', apk, p + 28)
              name = bytes(apk[p+46:p+46+name_len]).decode('utf-8')
              local_off = struct.unpack_from('<I', apk, p + 42)[0]
              if name == 'classes.dex':
                  dex_central = p
                  dex_local = local_off
                  break
              p += 46 + name_len + extra_len + comment_len
          if dex_central is None or dex_local is None:
              raise SystemExit('classes.dex not found')

          if apk[dex_local:dex_local+4] != b'PK\x03\x04':
              raise SystemExit('bad classes.dex local header')
          flags, method = struct.unpack_from('<HH', apk, dex_local + 6)
          if flags & 0x08 or method != 0:
              raise SystemExit(f'classes.dex must be stored/no descriptor; flags={flags} method={method}')
          name_len, extra_len = struct.unpack_from('<HH', apk, dex_local + 26)
          comp_size = struct.unpack_from('<I', apk, dex_local + 18)[0]
          data_off = dex_local + 30 + name_len + extra_len
          dex = bytearray(apk[data_off:data_off+comp_size])

          if dex[:8] != b'dex\n035\x00' and not dex.startswith(b'dex\n'):
              raise SystemExit('unexpected dex header')

          old = b'stable-3'
          new = b'stable-9'
          count = dex.count(old)
          if count < 3:
              raise SystemExit(f'expected >=3 stable-3 markers, got {count}')
          dex = dex.replace(old, new)

          # Recompute DEX SHA-1 signature and Adler32 checksum.
          dex[12:32] = hashlib.sha1(dex[32:]).digest()
          struct.pack_into('<I', dex, 8, zlib.adler32(dex[12:]) & 0xffffffff)

          # Write patched DEX in place; ZIP offsets stay unchanged.
          apk[data_off:data_off+comp_size] = dex
          crc = zlib.crc32(dex) & 0xffffffff
          struct.pack_into('<I', apk, dex_local + 14, crc)
          struct.pack_into('<I', apk, dex_central + 16, crc)
          path.write_bytes(apk)
          print(f'Patched {count} stable-3 markers -> stable-9; ZIP offsets preserved')
          PY

      - name: Materialize existing Ainubo signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks

      - name: Re-sign with official apksigner v1/v2/v3
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          STORE_PASS=$(sed -n 's/.*storePassword "\([^"]*\)".*/\1/p' android-nubo/app/build.gradle | head -1)
          KEY_PASS=$(sed -n 's/.*keyPassword "\([^"]*\)".*/\1/p' android-nubo/app/build.gradle | head -1)
          KEY_ALIAS=$(sed -n 's/.*keyAlias "\([^"]*\)".*/\1/p' android-nubo/app/build.gradle | head -1)
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          "$BUILD_TOOLS/apksigner" sign \
            --ks android-nubo/ainubo-debug.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out AinuboX1-V22.2.2-STABLE9.apk \
            patched.apk

      - name: Verify installability contracts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK=AinuboX1-V22.2.2-STABLE9.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' verify.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          unzip -p "$APK" classes.dex | strings | grep -q 'https://nubo.ainubo.com/?native=stable-9'
          unzip -p "$APK" classes.dex | strings | grep -q "dataset.nuboNative='stable-9'"
          if unzip -p "$APK" classes.dex | strings | grep -q 'v22-2-2x'; then
            echo 'Forbidden broken DEX marker v22-2-2x still present' >&2
            exit 1
          fi
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-V22.2.2-STABLE9-INSTALLABLE
          path: AinuboX1-V22.2.2-STABLE9.apk
          if-no-files-found: error
