name: NUBO JJ1 isolated Stable-3 APK

on:
  push:
    branches: [fix/jj1-webview-layout-lite]
    paths:
      - "scripts/patch-jj1-stable3-smali.py"
      - ".github/workflows/android-jj1-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  patch-jj1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (supported tools only)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: sdkmanager "build-tools;35.0.0"

      - name: Download verified Stable-3 native wake + Google Home binary
        uses: actions/download-artifact@v4
        with:
          name: AinuboX1-NUBO-STABLE-3.0-AUDIORECORD-NATIVE-WAKE
          path: stable3
          repository: lihsun82/nubo-voice
          run-id: 31972445305
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download apktool
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o apktool.jar
          java -jar apktool.jar --version

      - name: Materialize original Ainubo signing certificate
        run: |
          set -euo pipefail
          base64 --decode android-nubo/ainubo-debug.jks.b64 > android-nubo/ainubo-debug.jks
          keytool -list -keystore android-nubo/ainubo-debug.jks -storepass ainubo123 -alias ainubo >/dev/null

      - name: Decode verified Stable-3 and apply JJ1 patch
        run: |
          set -euo pipefail
          APK=$(find stable3 -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" stable3-original.apk
          java -jar apktool.jar d -f stable3-original.apk -o decoded
          python3 scripts/patch-jj1-stable3-smali.py
          MAIN=$(find decoded -path '*/com/ainubo/nubo/MainActivity.smali' -print -quit)
          test -n "$MAIN"
          grep -Fq 'NUBO-JJ1/1' "$MAIN"
          grep -RFl 'nubo-jj1-native-style' decoded/smali*/com/ainubo/nubo | head -1
          grep -Fq 'com.ainubo.nubo.jj1test' decoded/AndroidManifest.xml

      - name: Repack and align JJ1 test APK
        run: |
          set -euo pipefail
          java -jar apktool.jar b decoded -o jj1-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -P 16 4 jj1-unsigned.apk jj1-aligned.apk

      - name: Sign JJ1 APK with existing authorized certificate
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks android-nubo/ainubo-debug.jks \
            --ks-pass pass:ainubo123 \
            --key-pass pass:ainubo123 \
            --ks-key-alias ainubo \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out AinuboX1-JJ1-STABLE3-TEST-3.3.1.apk \
            jj1-aligned.apk

      - name: Verify test package and untouched integration binaries
        run: |
          set -euo pipefail
          APK=AinuboX1-JJ1-STABLE3-TEST-3.3.1.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" > /tmp/jj1-badging.txt
          grep -Fq "package: name='com.ainubo.nubo.jj1test'" /tmp/jj1-badging.txt
          grep -Fq "versionCode='3302'" /tmp/jj1-badging.txt
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/jj1-dex.txt
          grep -Fq 'NUBO-JJ1/1' /tmp/jj1-dex.txt
          grep -Fq 'nubo-jj1-native-style' /tmp/jj1-dex.txt
          grep -Fq 'NuboNativeWakeV3' /tmp/jj1-dex.txt
          grep -Fq 'GoogleHomeGatewayImpl' /tmp/jj1-dex.txt
          "$BT/apksigner" verify --print-certs stable3-original.apk | grep 'Signer #1 certificate SHA-256 digest' > /tmp/original-certificate.txt
          "$BT/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest' > /tmp/jj1-certificate.txt
          diff -u /tmp/original-certificate.txt /tmp/jj1-certificate.txt

      - name: Upload standalone installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AinuboX1-JJ1-STABLE3-TEST-3.3.1
          path: AinuboX1-JJ1-STABLE3-TEST-3.3.1.apk
          if-no-files-found: error
          retention-days: 30
